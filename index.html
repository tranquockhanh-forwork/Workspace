const isClosed = (status) => status === 'done' || status === 'cancelled';

function isOverdue(item) {
  if (isClosed(item.status)) return false;
  if (!item.plannedEnd) return false;
  return item.plannedEnd < TODAY;
}

/**
 * Trọng số của việc lá: giờ ước lượng, thiếu thì bằng TRUNG BÌNH các việc lá
 * có ước lượng. Giống hệt `leafWeigher` của module thật.
 */
function leafWeigher(items) {
  const parents = new Set(items.map((x) => x.parentId).filter(Boolean));
  const hours = items
    .filter((x) => !parents.has(x.id) && x.status !== 'cancelled' && x.estimateHours > 0)
    .map((x) => x.estimateHours);
  const fallback = hours.length ? hours.reduce((s, h) => s + h, 0) / hours.length : 1;
  return (item) => (item.estimateHours > 0 ? item.estimateHours : fallback);
}

/** Cuộn tiến độ cho node cha và cho cả dự án. */
function recalcProgress(projectId) {
  const items = workItems.filter((x) => x.projectId === projectId);
  const weightOf = leafWeigher(items);
  const childrenOf = (id) => items.filter((x) => x.parentId === id && x.status !== 'cancelled');

  const visit = (item) => {
    const children = childrenOf(item.id);
    if (children.length === 0) return { progress: item.progressPercent, weight: weightOf(item) };
    let weighted = 0;
    let total = 0;
    for (const child of children) {
      const r = visit(child);
      weighted += r.progress * r.weight;
      total += r.weight;
    }
    const progress = total === 0 ? 0 : Math.round(weighted / total);
    item.progressPercent = progress;
    return { progress, weight: total };
  };
  for (const root of items.filter((x) => !x.parentId)) visit(root);

  const parents = new Set(items.map((x) => x.parentId).filter(Boolean));
  const leaves = items.filter((x) => !parents.has(x.id) && x.status !== 'cancelled');
  let weighted = 0;
  let total = 0;
  for (const leaf of leaves) {
    const w = weightOf(leaf);
    weighted += leaf.progressPercent * w;
    total += w;
  }
  const project = projects.find((p) => p.id === projectId);
  if (project) project.progressPercent = total === 0 ? 0 : Math.round(weighted / total);
}

/** Tài chính dự án, đúng công thức của tab Tài chính thật. */
function financeOf(project) {
  const items = workItems.filter((x) => x.projectId === project.id);
  const actualCost = costEntries
    .filter((c) => items.some((x) => x.id === c.workItemId))
    .reduce((sum, c) => sum + c.amount, 0);
  const remainingEstimate = items
    .filter((x) => !isClosed(x.status))
    .reduce((sum, x) => sum + (x.estimatedCost || 0), 0);
  const forecast = actualCost + project.finance.committedCost + remainingEstimate;
  const profit = project.finance.contractValue - forecast;
  return {
    ...project.finance,
    actualCost,
    remainingEstimate,
    forecast,
    profit,
    margin: project.finance.contractValue ? (profit / project.finance.contractValue) * 100 : 0,
    budgetVariance: project.finance.budget - forecast,
  };
}

/** Việc chặn đóng: phụ thuộc FS mà việc đi trước chưa xong. */
function blockingDependencies(item) {
  return dependencies
    .filter((d) => d.successorId === item.id && d.dependencyType === 'FS')
    .map((d) => workItems.find((x) => x.id === d.predecessorId))
    .filter((x) => x && !isClosed(x.status));
}

/** Nhánh của một node, gồm chính nó. */
function branchOf(items, rootId) {
  const set = new Set([rootId]);
  let grew = true;
  while (grew) {
    grew = false;
    for (const item of items) {
      if (item.parentId && set.has(item.parentId) && !set.has(item.id)) {
        set.add(item.id);
        grew = true;
      }
    }
  }
  return set;
}

  return `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none"
    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"${cls ? ` class="${cls}"` : ''} aria-hidden="true">${paths}</svg>`;
}

/** Vai trò của người đang đăng nhập trong dự án đang mở. */
function myRole(project) {
  if (!project) return undefined;
  const entry = project.members.find((m) => m.userId === state.userId);
  if (entry) return entry.role;
  return USERS[state.userId].role === 'tenant-admin' ? 'owner' : undefined;
}
const canWrite = (project) => ['owner', 'manager', 'member'].includes(myRole(project));
const canManage = (project) => ['owner', 'manager'].includes(myRole(project));
const canSeeFinance = (project) => canManage(project) || USERS[state.userId].role === 'tenant-admin';

function unreadCountFor(channel) {
  return messages.filter(
    (m) => m.channel === channel && m.userId !== state.userId && !readMessages.has(`${state.userId}:${m.id}`),
  ).length;
}
/** Chấm đỏ trên node cha gộp cả tin chưa đọc của nhánh dưới. */
function unreadForNode(project, item) {
  if (!item) {
    const items = workItems.filter((x) => x.projectId === project.id);
    return unreadCountFor(`project:${project.id}`) +
      items.reduce((sum, x) => sum + unreadCountFor(`work_item:${x.id}`), 0);
  }
  const items = workItems.filter((x) => x.projectId === project.id);
  const branch = branchOf(items, item.id);
  return [...branch].reduce((sum, id) => sum + unreadCountFor(`work_item:${id}`), 0);
}

function treeRows(project) {
  const items = workItems.filter((x) => x.projectId === project.id);
  const search = state.treeSearch.trim().toLowerCase();
  const rows = [];
  const walk = (parentId, depth) => {
    for (const item of items.filter((x) => x.parentId === parentId)) {
      const children = items.filter((x) => x.parentId === item.id);
      rows.push({ item, depth, hasChildren: children.length > 0 });
      if (children.length && !state.collapsed.has(item.id)) walk(item.id, depth + 1);
    }
  };
  walk(null, 0);
  if (!search) return rows;
  return rows.filter(({ item }) =>
    `${item.code} ${item.title}`.toLowerCase().includes(search));
}

function renderTree(project) {
  const rows = treeRows(project);
  const projectUnread = unreadForNode(project, null);
  const nodeRow = ({ item, depth, hasChildren }) => {
    const active = state.nodeId === item.id;
    const unread = unreadForNode(project, item);
    const overdue = isOverdue(item);
    const toggle = hasChildren
      ? `<button type="button" class="${cx('treeToggle')}" data-toggle="${item.id}"
          aria-label="${state.collapsed.has(item.id) ? 'Mở nhánh' : 'Thu gọn nhánh'}"
          aria-expanded="${!state.collapsed.has(item.id)}">${icon(state.collapsed.has(item.id) ? 'chevron-right' : 'chevron-down', 14)}</button>`
      : `<span class="${cx('treeToggleSpacer')}" aria-hidden="true"></span>`;
    return `<li><div class="${cx('treeRow')}" style="padding-left:${(0.5 + depth * 0.95).toFixed(2)}rem">
      ${toggle}
      <button type="button" class="${cx(active ? 'treeNodeActive' : 'treeNode')}" data-node="${item.id}">
        ${icon(item.itemType === 'phase' ? 'folder' : 'circle-dot', 13)}
        <span class="${cx('treeCode')}">${item.code}</span>
        <span class="${cx('treeTitle')}">${esc(item.title)}</span>
        ${item.executionType === 'procedure' ? icon('link', 12) : ''}
        ${unread ? `<span class="${cx('unreadDot')}" title="${unread} tin nhắn chưa đọc">${unread}</span>` : ''}
        ${overdue ? `<span class="${cx('treeOverdue')}" title="Quá hạn">Quá hạn</span>` : ''}
        <span class="${cx('treeBadge')}" style="${STATUS_TONE[item.status]}">${STATUS_LABELS[item.status]}</span>
      </button></div></li>`;
  };

  return `<aside class="${cx('sidebar')}">
    <div class="${cx('sidebarHead')}">
      <select aria-label="Chọn dự án" data-action="select-project">
        ${projects.map((p) => `<option value="${p.id}"${p.id === project.id ? ' selected' : ''}>${p.code} · ${esc(p.name)} (${PROJECT_STATUS_LABELS[p.status]})</option>`).join('')}
      </select>
      <button type="button" class="${cx('iconButton')}" aria-label="Dự án mới" title="Dự án mới" data-action="new-project"${canWrite(project) ? '' : ' disabled'}>${icon('plus', 16)}</button>
      <button type="button" class="${cx('iconButton')}" aria-label="Mở trao đổi" title="Trao đổi về mục đang chọn" data-action="open-chat">
        ${icon('message-square', 15)}${projectUnread ? `<span class="${cx('iconBadge')}"></span>` : ''}
      </button>
      <button type="button" class="${cx('iconButton')}" aria-label="Tải lại" title="Tải lại" data-action="reload">${icon('refresh-cw', 15)}</button>
    </div>
    <div class="${cx('tree')}">
      <label class="${cx('treeSearch')}">
        ${icon('search', 14)}
        <input placeholder="Tìm công việc theo mã hoặc tên" type="search" value="${esc(state.treeSearch)}" data-action="tree-search">
      </label>
      <ul class="${cx('treeList')}">
        <li><button type="button" class="${cx(state.nodeId === null ? 'treeNodeActive' : 'treeNode')}" data-node="root" style="padding-left:.5rem">
          ${icon('folder', 15)}
          <span class="${cx('treeCode')}">${project.code}</span>
          <span class="${cx('treeTitle')}">${esc(project.name)}</span>
          ${projectUnread ? `<span class="${cx('unreadDot')}" title="${projectUnread} tin nhắn chưa đọc">${projectUnread}</span>` : ''}
          <span class="${cx('treePercent')}">${percent(project.progressPercent)}</span>
        </button></li>
        ${rows.map(nodeRow).join('')}
      </ul>
    </div>
  </aside>`;
}

const TABS = ['Tổng quan', 'Công việc', 'Kanban', 'Gantt', 'Lịch biểu', 'Tài liệu', 'Tài chính', 'Hoạt động'];

function renderTabBar(project) {
  const tabs = TABS.filter((t) => t !== 'Tài chính' || canSeeFinance(project));
  return `<div class="${cx('tabBar')}" role="tablist">
    ${tabs.map((t) => `<button type="button" role="tab" aria-selected="${t === state.tab}"
      class="${cx(t === state.tab ? 'tabActive' : 'tab')}" data-tab="${t}">${t}</button>`).join('')}
  </div>`;
}

function renderBreadcrumb(project) {
  const parts = [];
  let item = state.nodeId ? workItems.find((x) => x.id === state.nodeId) : null;
  while (item) {
    parts.unshift(`${item.code} · ${item.title}`);
    item = item.parentId ? workItems.find((x) => x.id === item.parentId) : null;
  }
  parts.unshift(project.name);
  return `<nav class="${cx('breadcrumb')}" aria-label="Đường dẫn node">
    ${parts.map((p, i) => `<span>${esc(p)}${i < parts.length - 1 ? '<span aria-hidden="true"> / </span>' : ''}</span>`).join('')}
  </nav>`;
}

function stat(value, label, opts = {}) {
  return `<div class="${cx(opts.danger ? 'statDanger' : 'stat')}"${opts.title ? ` title="${esc(opts.title)}"` : ''}>
    <span class="${cx('statValue')}">${value}</span>
    <span class="${cx('statLabel')}">${opts.iconName ? icon(opts.iconName, 13) + ' ' : ''}${label}</span>
    ${opts.hint ? `<span class="${cx('statHint')}">${opts.hint}</span>` : ''}
  </div>`;
}

function progressCell(value) {
  return `<div class="${cx('progressTrack')}" aria-label="${percent(value)}">
    <div class="${cx('progressFill')}" style="width:${Math.round(value || 0)}%"></div>
  </div>`;
}

function statusSelect(item, disabled) {
  return `<select aria-label="Trạng thái của ${item.code}" data-status-for="${item.id}"${disabled ? ' disabled' : ''}>
    ${STATUS_ORDER.map((s) => `<option value="${s}"${s === item.status ? ' selected' : ''}>${STATUS_LABELS[s]}</option>`).join('')}
  </select>`;
}

/** Công việc thuộc phạm vi node đang chọn (cả nhánh, không tính chính nó). */
function scopeItems(project) {
  const items = workItems.filter((x) => x.projectId === project.id);
  if (!state.nodeId) return items;
  const branch = branchOf(items, state.nodeId);
  return items.filter((x) => branch.has(x.id) && x.id !== state.nodeId);
}

function tabOverview(project) {
  const selected = state.nodeId ? workItems.find((x) => x.id === state.nodeId) : null;
  const scope = scopeItems(project);
  const parentIds = new Set(scope.map((x) => x.parentId).filter(Boolean));
  const leaves = scope.filter((x) => !parentIds.has(x.id) && x.status !== 'cancelled');
  const done = leaves.filter((x) => x.status === 'done').length;
  const closed = scope.filter((x) => isClosed(x.status)).length;
  const overdue = scope.filter(isOverdue).length;

  const stats = `<div class="${cx('statRow')}">
    ${stat(percent(selected ? selected.progressPercent : project.progressPercent), 'Tiến độ',
      { hint: leaves.length ? `${done}/${leaves.length} việc đã xong` : '' })}
    ${stat(String(scope.length), 'Công việc trong nhánh')}
    ${stat(String(closed), 'Đã đóng')}
    ${stat(String(overdue), 'Quá hạn', { danger: overdue > 0 })}
  </div>`;

  const details = selected
    ? `<dl class="${cx('definitionList')}">
        <dt>Loại</dt><dd>${selected.itemType === 'phase' ? 'Nhóm công việc' : 'Công việc'}</dd>
        <dt>Trạng thái</dt><dd>${STATUS_LABELS[selected.status]}</dd>
        <dt>Độ ưu tiên</dt><dd>${PRIORITY_LABELS[selected.priority]}</dd>
        <dt>Cách thực hiện</dt><dd>${selected.executionType === 'procedure' ? 'Theo quy trình' : 'Thủ công'}</dd>
        <dt>Người phụ trách</dt><dd>${selected.assigneeUserId ? nameOf(selected.assigneeUserId) : 'Chưa giao'}</dd>
        <dt>Giờ ước lượng</dt><dd>${selected.estimateHours ? `${selected.estimateHours} giờ` : '—'}</dd>
        <dt>Kế hoạch</dt><dd>${dateRange(selected.plannedStart, selected.plannedEnd)}</dd>
      </dl>`
    : `<dl class="${cx('definitionList')}">
        <dt>Mã dự án</dt><dd>${project.code}</dd>
        <dt>Trạng thái</dt><dd>${PROJECT_STATUS_LABELS[project.status]}</dd>
        <dt>Vai trò của tôi</dt><dd>${ROLE_LABELS[myRole(project)] ?? 'Quản trị viên tenant'}</dd>
        <dt>Khách hàng</dt><dd>${project.customerRef || '—'}</dd>
        <dt>Kế hoạch</dt><dd>${dateRange(project.startDate, project.endDate)}</dd>
      </dl>
      <p class="${cx('description')}">${esc(project.description)}</p>`;

  const deps = dependencies.filter((d) => d.successorId === state.nodeId);
  const candidates = workItems.filter(
    (x) => x.projectId === project.id && x.id !== state.nodeId && x.itemType !== 'phase');
  const dependencyPanel = selected
    ? `<section class="${cx('panel')}">
        <h3>Phụ thuộc — việc phải đi trước</h3>
        ${deps.length
          ? `<ul class="${cx('memberList')}">${deps.map((d) => {
              const pre = workItems.find((x) => x.id === d.predecessorId);
              return `<li><span class="${cx('memberName')}">${pre.code} · ${esc(pre.title)}
                <span class="${cx('muted')}"> · ${d.dependencyType}</span></span>
                <span class="${cx('memberRole')}">
                  <span class="${cx('treeBadge')}" style="${STATUS_TONE[pre.status]}">${STATUS_LABELS[pre.status]}</span>
                  ${canWrite(project) ? `<button type="button" class="${cx('iconButton')}" aria-label="Gỡ phụ thuộc" data-action="remove-dependency" data-id="${d.id}">${icon('x', 13)}</button>` : ''}
                </span></li>`;
            }).join('')}</ul>`
          : `<p class="${cx('muted')}">Công việc này chưa phụ thuộc việc nào.</p>`}
        ${canWrite(project) ? `<div class="${cx('inlineForm')}">
          <select aria-label="Việc phải đi trước" data-field="dependency-predecessor">
            <option value="">— Chọn việc đi trước —</option>
            ${candidates.map((x) => `<option value="${x.id}">${x.code} · ${esc(x.title)}</option>`).join('')}
          </select>
          <button type="button" class="${cx('buttonGhost')}" data-action="add-dependency">Thêm</button>
        </div>
        <p class="${cx('muted')}">Chỉ loại FS chặn đóng công việc khi việc đi trước chưa xong.</p>` : ''}
      </section>`
    : '';

  const procedurePanel = selected?.executionType === 'procedure'
    ? `<section class="${cx('panel')}">
        <h3>Hồ sơ ở module khác</h3>
        <ul class="${cx('memberList')}">
          <li><span class="${cx('memberName')}">
            <a href="#" data-action="open-procedure">${selected.procedureCode} ↗</a>
            <span class="${cx('muted')}"> · Quy trình · ${esc(selected.title)}</span></span>
            <span class="${cx('memberRole')}">Đang chạy</span></li>
        </ul>
        <p class="${cx('muted')}">Nhãn là bản sao để hiển thị; nguồn sự thật là module Quy trình.</p>
      </section>`
    : '';

  const memberPanel = `<section class="${cx('panel')}">
    <h3 class="${cx('panelHeadRow')}">Thành viên dự án${canManage(project)
      ? `<button type="button" class="${cx('linkButton')}" data-action="members">Quản lý thành viên</button>` : ''}</h3>
    <ul class="${cx('memberList')}">
      ${project.members.map((m) => `<li>
        <span class="${cx('memberName')}">${nameOf(m.userId)}</span>
        <span class="${cx('memberRole')}">${ROLE_LABELS[m.role]}</span></li>`).join('')}
    </ul>
  </section>`;

  return `${stats}
    <section class="${cx('panel')}">
      <h3>${selected ? `${selected.code} · ${esc(selected.title)}` : esc(project.name)}</h3>
      ${details}
    </section>
    ${dependencyPanel}${procedurePanel}${memberPanel}`;
}

/* ----------------------------------------------------------- công việc */

function tabWorkItems(project) {
  let rows = scopeItems(project).filter((x) => x.itemType !== undefined);
  if (state.statusFilter !== 'all') rows = rows.filter((x) => x.status === state.statusFilter);
  if (state.onlyOverdue) rows = rows.filter(isOverdue);
  const { key, desc } = state.sort;
  const value = (item) => ({
    code: item.code, title: item.title, status: STATUS_ORDER.indexOf(item.status),
    priority: item.priority, plannedEnd: item.plannedEnd ?? '9999',
  })[key];
  rows = [...rows].sort((a, b) => (value(a) > value(b) ? 1 : value(a) < value(b) ? -1 : 0) * (desc ? -1 : 1));

  const header = (label, sortKey) => `<th${sortKey ? ` aria-sort="${key === sortKey ? (desc ? 'descending' : 'ascending') : 'none'}"` : ''}>
    ${sortKey
      ? `<button type="button" class="${cx('sortButton')}" data-sort="${sortKey}">${label}${key === sortKey ? `<span aria-hidden="true"> ${desc ? '↓' : '↑'}</span>` : ''}</button>`
      : label}</th>`;

  return `<div class="${cx('filterBar')}">
      <select aria-label="Lọc theo trạng thái" data-action="filter-status">
        <option value="all"${state.statusFilter === 'all' ? ' selected' : ''}>Tất cả trạng thái</option>
        ${STATUS_ORDER.map((s) => `<option value="${s}"${state.statusFilter === s ? ' selected' : ''}>${STATUS_LABELS[s]}</option>`).join('')}
      </select>
      <label class="${cx('checkbox')}"><input type="checkbox" data-action="filter-overdue"${state.onlyOverdue ? ' checked' : ''}>Chỉ việc quá hạn</label>
      <span class="${cx('muted')}">${rows.length} công việc</span>
    </div>
    <table class="${cx('table')}">
      <thead><tr>
        ${header('Mã', 'code')}${header('Tên công việc', 'title')}${header('Trạng thái', 'status')}
        ${header('Ưu tiên', 'priority')}<th>Người phụ trách</th>${header('Hạn', 'plannedEnd')}<th>Tiến độ</th>
      </tr></thead>
      <tbody>
        ${rows.map((item) => `<tr>
          <td><button type="button" class="${cx('linkButton')}" data-node="${item.id}">${item.code}</button></td>
          <td>${esc(item.title)}</td>
          <td>${statusSelect(item, !canWrite(project))}</td>
          <td>${PRIORITY_LABELS[item.priority]}</td>
          <td>${item.assigneeUserId ? nameOf(item.assigneeUserId) : '—'}</td>
          <td${isOverdue(item) ? ` class="${cx('cellDanger')}"` : ''}>${formatDate(item.plannedEnd) || '—'}</td>
          <td>${progressCell(item.progressPercent)}</td>
        </tr>`).join('')}
      </tbody>
    </table>
    ${rows.length === 0 ? `<p class="${cx('muted')}">Không có công việc nào khớp bộ lọc.</p>` : ''}`;
}

/* ---------------------------------------------------------------- gantt */

function tabGantt(project) {
  const items = scopeItems(project).filter((x) => x.plannedStart && x.plannedEnd);
  if (!items.length) return `<p class="${cx('muted')}">Chưa có công việc nào có ngày kế hoạch.</p>`;

  const day = 86400000;
  const dates = items.flatMap((x) => [new Date(x.plannedStart).getTime(), new Date(x.plannedEnd).getTime()]);
  const min = new Date(Math.min(...dates) - 2 * day);
  const max = new Date(Math.max(...dates) + 2 * day);
  const pxPerDay = { day: 26, week: 10, month: 3.2 }[state.ganttZoom];
  const totalDays = Math.ceil((max - min) / day);
  const width = Math.max(totalDays * pxPerDay, 600);
  const rowHeight = 26;
  const top = 26;
  const height = top + items.length * rowHeight + 10;
  const xOf = (iso) => ((new Date(iso) - min) / day) * pxPerDay;

  const ticks = [];
  for (let i = 0; i <= totalDays; i += state.ganttZoom === 'day' ? 1 : state.ganttZoom === 'week' ? 7 : 30) {
    const date = new Date(min.getTime() + i * day);
    ticks.push(`<g><line x1="${i * pxPerDay}" y1="22" x2="${i * pxPerDay}" y2="${height}" stroke="#e2e8f0"/>
      <text x="${i * pxPerDay + 3}" y="16" class="${cx('ganttTickLabel')}">${date.getDate()}/${date.getMonth() + 1}</text></g>`);
  }

  const bars = items.map((item, i) => {
    const y = top + i * rowHeight;
    const x = xOf(item.plannedStart);
    const w = Math.max(xOf(item.plannedEnd) - x, 4);
    const fill = isOverdue(item) ? '#fecaca' : item.itemType === 'phase' ? '#c7d2fe' : '#dbeafe';
    const stroke = isOverdue(item) ? '#b91c1c' : '#1d4ed8';
    return `<g>
      <rect x="${x}" y="${y + 4}" width="${w}" height="14" rx="4" fill="${fill}" stroke="${stroke}" stroke-width="1"/>
      <rect x="${x}" y="${y + 4}" width="${(w * (item.progressPercent || 0)) / 100}" height="14" rx="4" fill="${stroke}" opacity=".55"/>
      <title>${esc(item.code)} · ${esc(item.title)} — ${percent(item.progressPercent)}</title>
    </g>`;
  }).join('');

  const rowOf = (id) => items.findIndex((x) => x.id === id);
  const arrows = dependencies.filter((d) => d.projectId === project.id).map((d) => {
    const from = rowOf(d.predecessorId);
    const to = rowOf(d.successorId);
    if (from < 0 || to < 0) return '';
    const pre = items[from];
    const suc = items[to];
    const x1 = xOf(pre.plannedEnd);
    const y1 = top + from * rowHeight + 11;
    const x2 = xOf(suc.plannedStart);
    const y2 = top + to * rowHeight + 11;
    return `<path d="M${x1} ${y1} H${x1 + 8} V${y2} H${x2}" fill="none" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrow)"/>`;
  }).join('');

  const todayX = xOf(TODAY);

  return `<div class="${cx('calendarBar')}">
      <strong class="${cx('calendarLabel')}">${formatDate(min.toISOString())} – ${formatDate(max.toISOString())}</strong>
      <div class="${cx('segmented')}" role="group" aria-label="Mức thu phóng">
        ${[['day', 'Ngày'], ['week', 'Tuần'], ['month', 'Tháng']].map(([id, label]) =>
          `<button type="button" aria-pressed="${state.ganttZoom === id}" class="${cx(state.ganttZoom === id ? 'segmentActive' : 'segment')}" data-zoom="${id}">${label}</button>`).join('')}
      </div>
    </div>
    <div class="${cx('gantt')}">
      <div class="${cx('ganttLabels')}" style="width:200px">
        <div class="${cx('ganttAxisSpacer')}" style="height:${top}px"></div>
        ${items.map((item) => `<button type="button" class="${cx('ganttLabel')}" style="height:${rowHeight}px" title="${item.code} · ${esc(item.title)}" data-node="${item.id}">${esc(item.title)}</button>`).join('')}
      </div>
      <div class="${cx('ganttScroll')}">
        <svg class="${cx('ganttSvg')}" width="${width}" height="${height}" role="img" aria-label="Biểu đồ Gantt của dự án">
          <defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto">
            <path d="M0,0 L6,3 L0,6 z" fill="#94a3b8"/></marker></defs>
          ${ticks.join('')}
          <line x1="${todayX}" y1="22" x2="${todayX}" y2="${height}" stroke="#f97316" stroke-width="1.5" stroke-dasharray="4 3"/>
          ${bars}${arrows}
        </svg>
      </div>
    </div>`;
}

/** Buổi của một sự kiện lặp, trong khoảng [from, to]. */
function occurrencesOf(event, from, to) {
  const out = [];
  const start = new Date(event.date);
  const count = event.recurrence ? (event.recurrenceCount ?? 1) : 1;
  const stepDays = event.recurrence === 'FREQ=WEEKLY' ? 7 : event.recurrence === 'FREQ=DAILY' ? 1 : 0;
  for (let i = 0; i < count; i += 1) {
    const date = new Date(start.getTime() + i * stepDays * 86400000);
    const iso = date.toISOString().slice(0, 10);
    if (iso >= from && iso <= to) out.push({ ...event, date: iso, occurrence: i });
    if (!stepDays) break;
  }
  return out;
}

function eventsInRange(projectId, from, to) {
  return events
    .filter((e) => !projectId || e.projectId === projectId)
    .flatMap((e) => occurrencesOf(e, from, to))
    .sort((a, b) => (a.date + a.startTime).localeCompare(b.date + b.startTime));
}

function tabCalendar(project) {
  const anchor = new Date(state.calendarAnchor);
  const monthView = state.calendarMode === 'month';
  let first;
  let days;
  if (monthView) {
    first = new Date(anchor.getFullYear(), anchor.getMonth(), 1);
    days = 42;
  } else {
    const weekday = (anchor.getDay() + 6) % 7;
    first = new Date(anchor.getTime() - weekday * 86400000);
    days = 7;
  }
  const gridStart = monthView
    ? new Date(first.getTime() - (((first.getDay() + 6) % 7) * 86400000))
    : first;
  const iso = (date) => new Date(date.getTime() - date.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  const range = [...Array(days)].map((_, i) => new Date(gridStart.getTime() + i * 86400000));
  const occurrences = eventsInRange(project.id, iso(range[0]), iso(range[range.length - 1]));

  const label = monthView
    ? `Tháng ${anchor.getMonth() + 1}/${anchor.getFullYear()}`
    : `Tuần ${formatDate(iso(range[0]))} – ${formatDate(iso(range[6]))}`;

  const cells = range.map((date) => {
    const key = iso(date);
    const outside = monthView && date.getMonth() !== anchor.getMonth();
    const today = key === TODAY;
    const entries = occurrences.filter((o) => o.date === key);
    return `<div class="${cx('calendarCell', outside ? 'calendarCellMuted' : '', today ? 'calendarCellToday' : '', monthView ? '' : 'calendarCellTall')}" data-day="${key}">
      <span class="${cx('calendarDayNumber')}">${date.getDate()}</span>
      ${entries.map((o) => `<button type="button" class="${cx('calendarEntry')}" data-event="${o.id}" data-date="${o.date}">
        <span class="${cx('calendarEntryTime')}">${o.startTime}</span>
        <span class="${cx('calendarEntryTitle')}">${esc(o.title)}</span></button>`).join('')}
    </div>`;
  }).join('');

  return `<div class="${cx('calendarBar')}">
      <button type="button" class="${cx('iconButton')}" aria-label="Kỳ trước" data-action="calendar-prev">${icon('chevron-left', 15)}</button>
      <button type="button" class="${cx('buttonGhost')}" data-action="calendar-today">Hôm nay</button>
      <button type="button" class="${cx('iconButton')}" aria-label="Kỳ sau" data-action="calendar-next">${icon('chevron-right', 15)}</button>
      <strong class="${cx('calendarLabel')}">${label}</strong>
      <div class="${cx('segmented')}" role="group" aria-label="Chế độ xem">
        ${[['week', 'Tuần'], ['month', 'Tháng']].map(([id, text]) =>
          `<button type="button" aria-pressed="${state.calendarMode === id}" class="${cx(state.calendarMode === id ? 'segmentActive' : 'segment')}" data-calendar-mode="${id}">${text}</button>`).join('')}
      </div>
      ${canWrite(project) ? `<button type="button" class="${cx('buttonPrimary')}" data-action="new-event">${icon('calendar-plus', 14)} Sự kiện mới</button>` : ''}
    </div>
    <div class="${cx('calendarGrid')}">
      ${['T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'CN'].map((d) => `<div class="${cx('calendarWeekday')}">${d}</div>`).join('')}
      ${cells}
    </div>`;
}

/** Đổi trạng thái, có kiểm phụ thuộc FS và việc con chưa xong như module thật. */
function changeStatus(itemId, status) {
  const item = workItems.find((x) => x.id === itemId);
  const project = projects.find((p) => p.id === item.projectId);
  if (!canWrite(project)) return toast('Bạn không có quyền ghi trong dự án này.');

  if (status === 'done') {
    const blocking = blockingDependencies(item);
    if (blocking.length) {
      return toast(`Chưa đóng được: ${blocking.map((x) => x.code).join(', ')} phải xong trước (FS).`);
    }
    const openChildren = workItems.filter(
      (x) => x.parentId === item.id && !isClosed(x.status));
    if (openChildren.length) {
      return toast(`Chưa đóng được: còn ${openChildren.length} việc con chưa xong.`);
    }
  }
  const from = STATUS_LABELS[item.status];
  item.status = status;
  if (status === 'done') item.progressPercent = 100;
  if (status === 'todo') item.progressPercent = 0;
  if (status === 'in_progress' && item.progressPercent === 0) item.progressPercent = 10;
  recalcProgress(item.projectId);
  log(item.projectId, item.id, `${from} → ${STATUS_LABELS[status]}`);
  render();
}

function openChat(channel) {
  state.chat = { channel, replyTo: null };
  for (const m of messages.filter((x) => x.channel === channel)) {
    readMessages.add(`${state.userId}:${m.id}`);
  }
  render();
}

function sendMessage(body) {
  if (!body.trim()) return;
  const mentions = DIRECTORY.filter((u) => body.includes(`@${u.name}`)).map((u) => u.id);
  messages.push({
    id: uid('m'), channel: state.chat.channel, parentId: state.chat.replyTo,
    userId: state.userId, body: body.trim(), mentions, createdAt: new Date().toISOString(),
  });
  state.chat.replyTo = null;
  render();
}

function exportCsv() {
  const rows = [['Mã', 'Công việc', 'Dự án', 'Trạng thái', 'Người phụ trách', 'Hạn', 'Tiến độ']];
  for (const item of workItems.filter((x) => visibleProjects().some((p) => p.id === x.projectId))) {
    const project = projects.find((p) => p.id === item.projectId);
    rows.push([item.code, item.title, project.code, STATUS_LABELS[item.status],
      item.assigneeUserId ? nameOf(item.assigneeUserId) : '', item.plannedEnd ?? '', `${item.progressPercent}%`]);
  }
  const csv = '﻿' + rows.map((r) => r.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\r\n');
  const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  const link = document.createElement('a');
  link.href = url;
  link.download = 'bao-cao-workspace.csv';
  link.click();
  URL.revokeObjectURL(url);
  toast('Đã tải báo cáo CSV.');
}

      body: `
        ${field('Thư mục', select('folderId', folderOptions, folderOptions[0]?.[0]))}
        ${field('Tệp', `<input type="file" data-field="file">`, 'Tối đa 50 MB. Hỗ trợ PDF, Office, ảnh, CSV, ZIP.')}
        ${field('Tên hiển thị', input('name', ''), 'Để trống thì lấy theo tên tệp.')}
        ${field('Gắn vào công việc', select('workItemId', [['', 'Không gắn'],
          ...workItems.filter((x) => x.projectId === project.id).map((x) => [x.id, `${x.code} · ${x.title}`])],
          state.nodeId ?? ''))}`,
    });
  }

  if (d.kind === 'folder') {
    return dialogShell({
      title: 'Thư mục mới', subtitle: 'Tên thư mục phải khác các thư mục cùng cấp.', submitLabel: 'Tạo thư mục',
      body: field('Tên thư mục', input('name', '', 'required')),
    });
  }

  if (d.kind === 'finance') {
    const f = project.finance;
    return dialogShell({
      title: 'Số liệu tài chính dự án', subtitle: esc(project.name), submitLabel: 'Lưu',
      body: `
        ${field('Giá trị hợp đồng', input('contractValue', f.contractValue, 'type="number" min="0"'))}
        ${field('Ngân sách được duyệt', input('budget', f.budget, 'type="number" min="0"'))}
        ${field('Chi phí đã cam kết', input('committedCost', f.committedCost, 'type="number" min="0"'))}`,
    });
  }

  if (d.kind === 'cost') {
    const item = workItems.find((x) => x.id === d.itemId);
    return dialogShell({
      title: 'Ghi chi phí thực tế', subtitle: `${item.code} · ${item.title}`, submitLabel: 'Ghi vào sổ',
      body: `${field('Số tiền (VND)', input('amount', '', 'type="number" min="0" required'))}
        ${field('Lý do', input('note', '', 'required'))}`,
    });
  }

  if (d.kind === 'confirm') {
    return dialogShell({
      title: d.title, subtitle: d.message, submitLabel: d.submitLabel ?? 'Xác nhận',
      body: d.requireCode
        ? field(`Gõ lại mã ${d.requireCode} để xác nhận`, input('confirmCode', '', 'required'))
        : '',
    });
  }
  return '';
}

/* ------------------------------------------------------------- drawer chat */

function renderChat() {
  if (!state.chat) return '';
  const { channel } = state.chat;
  const isProject = channel.startsWith('project:');
  const item = isProject ? null : workItems.find((x) => x.id === channel.slice('work_item:'.length));
  const project = currentProject();
  const list = messages.filter((m) => m.channel === channel && !m.parentId);
  const bubble = (m, reply) => `<div class="${cx(reply ? 'chatReply' : '')}">
    <div class="${cx('chatBubble', m.userId === state.userId ? 'chatBubbleMine' : '')}">
      <p class="${cx('chatMeta')}"><strong>${nameOf(m.userId)}</strong><span>${formatDateTime(m.createdAt)}</span></p>
      <p class="${cx('chatBody')}">${esc(m.body)}</p>
      <p class="${cx('chatActions')}">
        <button type="button" data-action="reply" data-id="${m.id}">Trả lời</button>
        ${m.userId === state.userId ? `<button type="button" class="${cx('chatActionDanger')}" data-action="delete-message" data-id="${m.id}">Thu hồi</button>` : ''}
      </p>
    </div>
    ${messages.filter((x) => x.parentId === m.id).map((x) => bubble(x, true)).join('')}
  </div>`;

  return `<aside class="${cx('drawer')}" role="complementary" aria-label="Trao đổi về ${item ? `${item.code} · ${item.title}` : project.name}">
    <header class="${cx('drawerHead')}">
      <div><h3>Trao đổi</h3><p>${item ? `${item.code} · ${esc(item.title)}` : esc(project.name)}</p></div>
      <button type="button" aria-label="Đóng" data-action="close-chat">${icon('x', 16)}</button>
    </header>
    <div class="${cx('drawerBody')}">
      ${list.length ? list.map((m) => bubble(m, false)).join('') : `<p class="${cx('muted')}">Chưa có trao đổi nào ở mục này.</p>`}
    </div>
    <div class="${cx('drawerFoot')}">
      ${state.chat.replyTo ? `<p class="${cx('muted')}">Đang trả lời một tin · <button type="button" class="${cx('linkButton')}" data-action="cancel-reply">bỏ</button></p>` : ''}
      <div class="${cx('chatComposer')}">
        <textarea rows="2" maxlength="5000" placeholder="Nhập nội dung, gõ @ để nhắc thành viên. Enter để gửi." data-chat-input
          ${canWrite(project) ? '' : 'disabled'}></textarea>
        <button type="button" class="${cx('buttonPrimary')}" data-action="send-message"${canWrite(project) ? '' : ' disabled'}>${icon('send', 15)}</button>
      </div>
    </div>
  </aside>`;
}

/* ------------------------------------------------------- menu chuột phải */

function renderMenu() {
  if (!state.menu) return '';
  const { x, y, itemId } = state.menu;
  const project = currentProject();
  const item = itemId ? workItems.find((i) => i.id === itemId) : null;
  const write = canWrite(project);
  const manage = canManage(project);

  const entries = item
    ? [
        { label: 'Thêm công việc con', action: 'add-child', disabled: !write },
        { label: 'Thêm công việc ngang cấp', action: 'add-sibling', disabled: !write },
        { label: 'Sửa công việc', action: 'edit-item', disabled: !write, sep: true },
        { label: 'Bắt đầu làm', action: 'start-item', disabled: !write || item.status !== 'todo' },
        { label: 'Đánh dấu hoàn thành', action: 'complete-item', disabled: !write || isClosed(item.status) },
        { label: 'Đưa lên cấp gốc', action: 'move-root', disabled: !manage || !item.parentId },
        { label: 'Mở trao đổi', action: 'chat-item', sep: true },
        { label: 'Tải lại', action: 'reload' },
        { label: 'Huỷ công việc', action: 'cancel-item', danger: true, sep: true, disabled: !write || isClosed(item.status) },
      ]
    : [
        { label: 'Thêm công việc cấp gốc', action: 'add-root', disabled: !write },
        { label: 'Sửa thông tin dự án', action: 'edit-project', disabled: !manage },
        { label: 'Mở trao đổi', action: 'chat-project', sep: true },
        { label: 'Tải lại', action: 'reload' },
        { label: 'Huỷ dự án', action: 'cancel-project', danger: true, sep: true, disabled: myRole(project) !== 'owner' },
      ];

  return `<div role="menu" class="${cx('contextMenu')}" style="left:${x}px; top:${y}px">
    ${entries.map((e) => `<button type="button" role="menuitem"${e.disabled ? ' disabled' : ''}
      class="${cx('contextItem', e.danger ? 'contextItemDanger' : '', e.sep ? 'contextItemSeparated' : '')}"
      data-menu="${e.action}">${e.label}</button>`).join('')}
  </div>`;
}

/* ================================================================= render */

function renderProjectsView() {
  const project = currentProject();
  const renderer = TAB_RENDERERS[state.tab] ?? TAB_RENDERERS['Tổng quan'];
  return `<div class="${cx('workspaceLayout')}">
    ${renderTree(project)}
    <section class="${cx('content')}">
      ${renderBreadcrumb(project)}
      ${renderTabBar(project)}
      <div class="${cx('tabBody')}">${renderer(project)}</div>
    </section>
  </div>`;
}

function renderBody() {
  if (state.view === 'projects') return renderProjectsView();
  if (state.view === 'my-work') return viewMyWork();
  if (state.view === 'documents') return viewDocuments();
  return viewReports();
}

function render() {
  const app = document.getElementById('app');
  const active = document.activeElement;
  const focusKey = active?.dataset?.field || (active?.hasAttribute?.('data-chat-input') ? 'chat' : null);
  const caret = active?.selectionStart;

  app.innerHTML = `<div class="${cx('shell')}">
    ${renderRail()}
    <main class="${cx('main')}">
      ${renderTopBar()}
      <div class="${cx('body')}">${renderBody()}</div>
    </main>
    ${renderChat()}${renderDialog()}${renderMenu()}
    ${state.toast ? `<div class="${cx('notice')}" id="mock-toast">${esc(state.toast)}</div>` : ''}
  </div>`;

  if (focusKey) {
    const next = focusKey === 'chat'
      ? app.querySelector('[data-chat-input]')
      : app.querySelector(`[data-field="${focusKey}"]`);
    if (next) {
      next.focus();
      if (caret != null && next.setSelectionRange) {
        try { next.setSelectionRange(caret, caret); } catch { /* input số không cho đặt con trỏ */ }
      }
    }
  }
}

/* ================================================================ sự kiện */

const formValues = (form) => {
  const out = {};
  for (const el of form.querySelectorAll('[data-field]')) out[el.dataset.field] = el.value;
  return out;
};

function submitDialog(form) {
  const d = state.dialog;
  const values = formValues(form);
  const project = currentProject();

  if (d.kind === 'work-item') {
    if (!values.title.trim()) return toast('Tên công việc không được để trống.');
    if (d.itemId) {
      const item = workItems.find((x) => x.id === d.itemId);
      Object.assign(item, {
        title: values.title.trim(),
        description: values.description,
        itemType: values.itemType,
        priority: values.priority,
        assigneeUserId: values.assigneeUserId || null,
        estimateHours: values.estimateHours ? Number(values.estimateHours) : undefined,
        plannedStart: values.plannedStart || null,
        plannedEnd: values.plannedEnd || null,
        estimatedCost: values.estimatedCost ? Number(values.estimatedCost) : item.estimatedCost,
      });
      log(project.id, item.id, 'Sửa thông tin công việc');
    } else {
      if (values.itemType === 'phase' && values.assigneeUserId) {
        return toast('Nhóm công việc không nhận người phụ trách.');
      }
      const siblings = workItems.filter((x) => x.projectId === project.id);
      const item = {
        id: uid('w'), projectId: project.id, parentId: d.parentId ?? null,
        code: `CV-${String(siblings.length + 1).padStart(3, '0')}`,
        title: values.title.trim(), description: values.description,
        itemType: values.itemType, status: 'todo', priority: values.priority,
        assigneeUserId: values.assigneeUserId || null,
        estimateHours: values.estimateHours ? Number(values.estimateHours) : undefined,
        plannedStart: values.plannedStart || null, plannedEnd: values.plannedEnd || null,
        progressPercent: 0,
        estimatedCost: values.estimatedCost ? Number(values.estimatedCost) : undefined,
        executionType: values.executionType === 'procedure' ? 'procedure' : 'manual',
        procedureCode: values.executionType === 'procedure' ? `PR-${Date.now().toString().slice(-8)}` : undefined,
      };
      workItems.push(item);
      state.nodeId = item.id;
      log(project.id, item.id, 'Tạo công việc');
      if (item.executionType === 'procedure') toast(`Đã mở hồ sơ ${item.procedureCode} bên module Quy trình.`);
    }
    recalcProgress(project.id);
  }

  if (d.kind === 'project') {
    if (projects.some((p) => p.code === values.code.trim())) return toast('Mã dự án đã tồn tại.');
    const created = {
      id: uid('p'), code: values.code.trim().toUpperCase(), name: values.name.trim(),
      description: values.description, status: 'planning', customerRef: values.customerRef,
      startDate: values.startDate || null, endDate: values.endDate || null,
      ownerUserId: state.userId, progressPercent: 0,
      finance: { contractValue: 0, budget: 0, committedCost: 0 },
      members: [{ userId: state.userId, role: 'owner' }],
    };
    projects.push(created);
    state.projectId = created.id;
    state.nodeId = null;
    log(created.id, null, 'Tạo dự án');
  }

  if (d.kind === 'members') {
    for (const el of form.querySelectorAll('[data-member-role]')) {
      const entry = project.members.find((m) => m.userId === el.dataset.memberRole);
      if (entry) entry.role = el.value;
    }
    if (project.members.filter((m) => m.role === 'owner').length !== 1) {
      return toast('Dự án phải có đúng một chủ nhiệm.');
    }
    log(project.id, null, 'Cập nhật thành viên dự án');
  }

  if (d.kind === 'event') {
    if (!values.title.trim()) return toast('Tiêu đề không được để trống.');
    events.push({
      id: uid('e'), projectId: project.id, title: values.title.trim(),
      eventType: values.eventType, location: values.location,
      date: values.date, startTime: values.startTime, endTime: values.endTime,
      organizerUserId: state.userId,
      participants: values.participant ? [{ userId: values.participant, response: 'needs_action' }] : [],
      recurrence: values.recurrence || null,
      recurrenceCount: values.recurrence ? Number(values.recurrenceCount || 1) : 1,
    });
    log(project.id, null, `Tạo sự kiện "${values.title.trim()}"`);
  }

  if (d.kind === 'upload') {
    const fileInput = form.querySelector('[data-field="file"]');
    const file = fileInput?.files?.[0];
    const fileName = file ? file.name : 'tai-lieu-moi.pdf';
    if (file && file.size > 50 * 1024 * 1024) return toast('Tệp vượt quá 50 MB.');
    documents.push({
      id: uid('doc'), projectId: project.id, folderId: values.folderId,
      workItemId: values.workItemId || null,
      name: (values.name || fileName.replace(/\.[^.]+$/, '')).trim(),
      fileName, version: 1, versions: 1, updatedAt: new Date().toISOString(),
      uploadedBy: state.userId, status: 'ready', lockedBy: null,
    });
    log(project.id, values.workItemId || null, `Tải lên tài liệu "${fileName}"`);
  }

  if (d.kind === 'folder') {
    if (!values.name.trim()) return toast('Tên thư mục không được để trống.');
    if (folders.some((f) => f.projectId === project.id && f.name === values.name.trim())) {
      return toast('Thư mục cùng tên đã tồn tại ở cấp này.');
    }
    folders.push({ id: uid('f'), projectId: project.id, name: values.name.trim() });
  }

  if (d.kind === 'finance') {
    if (Number(values.budget) < 0) return toast('Ngân sách không được âm.');
    project.finance = {
      contractValue: Number(values.contractValue || 0),
      budget: Number(values.budget || 0),
      committedCost: Number(values.committedCost || 0),
    };
    log(project.id, null, 'Cập nhật số liệu tài chính');
  }

  if (d.kind === 'cost') {
    const amount = Number(values.amount || 0);
    if (amount <= 0) return toast('Số tiền phải lớn hơn 0.');
    costEntries.push({
      id: uid('c'), workItemId: d.itemId, amount, note: values.note.trim(),
      createdBy: state.userId, createdAt: new Date().toISOString(),
    });
    log(project.id, d.itemId, `Ghi chi phí thực tế ${moneyShort(amount)} ₫`);
  }

  if (d.kind === 'confirm') {
    if (d.requireCode && values.confirmCode?.trim() !== d.requireCode) {
      return toast(`Hãy gõ đúng mã ${d.requireCode} để xác nhận.`);
    }
    d.onConfirm();
  }

  state.dialog = null;
  render();
}

function handleAction(action, el) {
  const project = currentProject();
  const id = el?.dataset?.id;

  switch (action) {
    case 'switch-user': {
      const ids = Object.keys(USERS).slice(0, 4);
      state.userId = ids[(ids.indexOf(state.userId) + 1) % ids.length];
      if (state.tab === 'Tài chính' && !canSeeFinance(project)) state.tab = 'Tổng quan';
      toast(`Đang xem với tài khoản ${nameOf(state.userId)} (${ROLE_LABELS[myRole(project)] ?? 'ngoài dự án'}).`);
      break;
    }
    case 'reload': toast('Đã tải lại dữ liệu.'); break;
    case 'new-project': state.dialog = { kind: 'project' }; render(); break;
    case 'members': state.dialog = { kind: 'members', term: '' }; render(); break;
    case 'add-member': {
      project.members.push({ userId: id, role: 'member' });
      state.dialog.term = '';
      render();
      break;
    }
    case 'remove-member': {
      const entry = project.members.find((m) => m.userId === id);
      const openItems = workItems.filter((x) => x.projectId === project.id && x.assigneeUserId === id && !isClosed(x.status));
      if (openItems.length) { toast(`Không gỡ được: ${nameOf(id)} còn ${openItems.length} việc đang mở.`); break; }
      project.members = project.members.filter((m) => m.userId !== id);
      render();
      break;
    }
    case 'open-chat': openChat(state.nodeId ? `work_item:${state.nodeId}` : `project:${project.id}`); break;
    case 'close-chat': state.chat = null; render(); break;
    case 'reply': state.chat.replyTo = id; render(); break;
    case 'cancel-reply': state.chat.replyTo = null; render(); break;
    case 'delete-message': {
      const index = messages.findIndex((m) => m.id === id);
      if (index >= 0) messages.splice(index, 1);
      render();
      break;
    }
    case 'send-message': {
      const box = document.querySelector('[data-chat-input]');
      sendMessage(box.value);
      break;
    }
    case 'close-dialog': state.dialog = null; render(); break;
    case 'new-event': state.dialog = { kind: 'event', date: state.calendarAnchor }; render(); break;
    case 'upload': state.dialog = { kind: 'upload' }; render(); break;
    case 'new-folder': state.dialog = { kind: 'folder' }; render(); break;
    case 'edit-finance': state.dialog = { kind: 'finance' }; render(); break;
    case 'add-cost': state.dialog = { kind: 'cost', itemId: id }; render(); break;
    case 'download-document': toast('Bản mock: tệp thật nằm trên kho lưu trữ của môi trường chạy.'); break;
    case 'new-version': {
      const doc = documents.find((x) => x.id === id);
      if (doc.lockedBy && doc.lockedBy !== state.userId) {
        toast(`Tài liệu đang bị ${nameOf(doc.lockedBy)} khoá.`);
        break;
      }
      doc.version += 1;
      doc.versions += 1;
      doc.updatedAt = new Date().toISOString();
      toast(`Đã tải lên phiên bản v${doc.version}.`);
      break;
    }
    case 'quick-start': changeStatus(id, 'in_progress'); break;
    case 'quick-done': changeStatus(id, 'done'); break;
    case 'respond': {
      const event = events.find((e) => e.id === id);
      const participant = event.participants.find((p) => p.userId === state.userId);
      if (participant) participant.response = el.dataset.response;
      toast('Đã gửi phản hồi lời mời.');
      break;
    }
    case 'export-csv': exportCsv(); break;
    case 'open-procedure': toast('Bản mock: hồ sơ thật nằm ở module Quy trình.'); break;
    case 'add-dependency': {
      const picker = document.querySelector('[data-field="dependency-predecessor"]');
      if (!picker?.value) { toast('Hãy chọn việc đi trước.'); break; }
      if (picker.value === state.nodeId) { toast('Một việc không thể phụ thuộc chính nó.'); break; }
      const exists = dependencies.some((d) => d.successorId === state.nodeId && d.predecessorId === picker.value);
      const reverse = dependencies.some((d) => d.successorId === picker.value && d.predecessorId === state.nodeId);
      if (exists || reverse) { toast('Phụ thuộc này tạo vòng lặp hoặc đã tồn tại.'); break; }
      dependencies.push({ id: uid('d'), projectId: project.id, successorId: state.nodeId, predecessorId: picker.value, dependencyType: 'FS', lagDays: 0 });
      render();
      break;
    }
    case 'remove-dependency': {
      const index = dependencies.findIndex((d) => d.id === id);
      if (index >= 0) dependencies.splice(index, 1);
      render();
      break;
    }
    case 'calendar-prev':
    case 'calendar-next': {
      const step = action === 'calendar-next' ? 1 : -1;
      const anchor = new Date(state.calendarAnchor);
      if (state.calendarMode === 'month') anchor.setMonth(anchor.getMonth() + step);
      else anchor.setDate(anchor.getDate() + step * 7);
      state.calendarAnchor = anchor.toISOString().slice(0, 10);
      render();
      break;
    }
    case 'calendar-today': state.calendarAnchor = TODAY; render(); break;
    default: break;
  }
}

function handleMenu(action) {
  const project = currentProject();
  const item = state.menu.itemId ? workItems.find((x) => x.id === state.menu.itemId) : null;
  state.menu = null;

  switch (action) {
    case 'add-root': state.dialog = { kind: 'work-item', parentId: null }; break;
    case 'add-child': state.dialog = { kind: 'work-item', parentId: item.id }; break;
    case 'add-sibling': state.dialog = { kind: 'work-item', parentId: item.parentId }; break;
    case 'edit-item': state.dialog = { kind: 'work-item', itemId: item.id }; break;
    case 'edit-project': state.dialog = { kind: 'project' }; break;
    case 'start-item': changeStatus(item.id, 'in_progress'); return;
    case 'complete-item': changeStatus(item.id, 'done'); return;
    case 'move-root': item.parentId = null; recalcProgress(project.id); log(project.id, item.id, 'Đưa lên cấp gốc'); break;
    case 'chat-item': openChat(`work_item:${item.id}`); return;
    case 'chat-project': openChat(`project:${project.id}`); return;
    case 'reload': toast('Đã tải lại dữ liệu.'); return;
    case 'cancel-item':
      state.dialog = {
        kind: 'confirm', title: 'Huỷ công việc',
        message: `${item.code} · ${item.title} sẽ chuyển sang trạng thái Đã huỷ và không còn tính vào tiến độ.`,
        submitLabel: 'Huỷ công việc',
        onConfirm: () => {
          item.status = 'cancelled';
          recalcProgress(project.id);
          log(project.id, item.id, 'Huỷ công việc');
        },
      };
      break;
    case 'cancel-project':
      state.dialog = {
        kind: 'confirm', title: 'Huỷ dự án',
        message: `Huỷ ${project.code}? Mọi công việc đang mở sẽ bị đóng. Thao tác này không hoàn tác được.`,
        submitLabel: 'Huỷ dự án', requireCode: project.code,
        onConfirm: () => {
          project.status = 'cancelled';
          log(project.id, null, 'Huỷ dự án');
        },
      };
      break;
    default: break;
  }
  render();
}

function boot() {
  const app = document.getElementById('app');

  app.addEventListener('click', (event) => {
    const el = event.target instanceof Element ? event.target : null;
    if (!el) return;

    if (el.closest('[data-close-overlay]') === el.closest(`.${cx('overlay')}`) && el.hasAttribute?.('data-close-overlay')) {
      state.dialog = null;
      return render();
    }
    const clickable = el.closest('button, a');
    if (!clickable) return;
    if (clickable.tagName === 'A') event.preventDefault();
    if (clickable.disabled) return;

    if (state.menu && !clickable.dataset.menu) { state.menu = null; render(); }

    const { nav, node, tab, toggle, sort, zoom, calendarMode, card, event: eventId,
      openItem, openProject, openChat: chatChannel, document: documentId, menu, action } = clickable.dataset;

    if (nav) { state.view = nav; state.menu = null; return render(); }
    if (node) {
      state.nodeId = node === 'root' ? null : node;
      state.view = 'projects';
      return render();
    }
    if (tab) { state.tab = tab; return render(); }
    if (toggle) {
      state.collapsed.has(toggle) ? state.collapsed.delete(toggle) : state.collapsed.add(toggle);
      return render();
    }
    if (sort) {
      state.sort = { key: sort, desc: state.sort.key === sort ? !state.sort.desc : false };
      return render();
    }
    if (zoom) { state.ganttZoom = zoom; return render(); }
    if (calendarMode) { state.calendarMode = calendarMode; return render(); }
    if (eventId) {
      const found = events.find((e) => e.id === eventId);
      toast(`${EVENT_TYPE_LABELS[found.eventType]} · ${found.title} · ${found.startTime}–${found.endTime}${found.location ? ` · ${found.location}` : ''}`);
      return;
    }
    if (openItem) {
      const item = workItems.find((x) => x.id === openItem);
      state.view = 'projects';
      state.projectId = item.projectId;
      state.nodeId = item.id;
      state.tab = 'Tổng quan';
      return render();
    }
    if (openProject) {
      state.view = 'projects';
      state.projectId = openProject;
      state.nodeId = null;
      return render();
    }
    if (chatChannel) { state.view = 'projects'; return openChat(chatChannel); }
    if (documentId) {
      const doc = documents.find((x) => x.id === documentId);
      toast(`${doc.name} · ${doc.fileName} · phiên bản v${doc.version}/${doc.versions}`);
      return;
    }
    if (menu) return handleMenu(menu);
    if (action) return handleAction(action, clickable);
  });

  app.addEventListener('submit', (event) => {
    event.preventDefault();
    if (event.target.matches('[data-dialog-form]')) submitDialog(event.target);
  });

  app.addEventListener('change', (event) => {
    const el = event.target;
    const { action, statusFor } = el.dataset;
    if (statusFor) return changeStatus(statusFor, el.value);
    if (action === 'select-project') { state.projectId = el.value; state.nodeId = null; return render(); }
    if (action === 'filter-status') { state.statusFilter = el.value; return render(); }
    if (action === 'filter-overdue') { state.onlyOverdue = el.checked; return render(); }
    if (action === 'document-project') { state.documentProject = el.value; state.documentFolder = ''; return render(); }
    if (action === 'document-folder') { state.documentFolder = el.value; return render(); }
    if (action === 'report-project') { state.reportProject = el.value; return render(); }
  });

  app.addEventListener('input', (event) => {
    const el = event.target;
    const { action, field: fieldName } = el.dataset;
    if (action === 'tree-search') { state.treeSearch = el.value; return render(); }
    if (action === 'document-search') { state.documentSearch = el.value; return render(); }
    if (fieldName === 'directory-search' && state.dialog?.kind === 'members') {
      state.dialog.term = el.value;
      return render();
    }
  });

  // Bắt phím ở cấp tài liệu: Esc phải đóng được kể cả khi con trỏ ngoài vùng app.
  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') {
      if (state.menu) { state.menu = null; return render(); }
      if (state.dialog) { state.dialog = null; return render(); }
      if (state.chat) { state.chat = null; return render(); }
    }
    if (event.key === 'Enter' && event.target.hasAttribute?.('data-chat-input') && !event.shiftKey) {
      event.preventDefault();
      sendMessage(event.target.value);
    }
  });

  app.addEventListener('contextmenu', (event) => {
    const el = event.target instanceof Element ? event.target : null;
    const nodeButton = el?.closest('[data-node]');
    if (!nodeButton) return;
    event.preventDefault();
    const nodeId = nodeButton.dataset.node;
    state.nodeId = nodeId === 'root' ? null : nodeId;
    state.menu = { x: event.clientX, y: event.clientY, itemId: nodeId === 'root' ? null : nodeId };
    render();
  });

  // Kéo thả Kanban: thả vào cột nào thì đổi sang trạng thái của cột đó.
  let dragging = null;
  app.addEventListener('dragstart', (event) => {
    const card = event.target.closest?.('[data-card]');
    if (!card) return;
    dragging = card.dataset.card;
    card.classList.add(cx('kanbanCardDragging'));
  });
  app.addEventListener('dragover', (event) => {
    if (dragging && event.target.closest?.('[data-column]')) event.preventDefault();
  });
  app.addEventListener('drop', (event) => {
    const column = event.target.closest?.('[data-column]');
    if (!dragging || !column) return;
    event.preventDefault();
    const itemId = dragging;
    dragging = null;
    changeStatus(itemId, column.dataset.column);
  });
  app.addEventListener('dragend', () => { dragging = null; render(); });

  render();
}

document.addEventListener('DOMContentLoaded', boot);

</script>
</body>
</html>
