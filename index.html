<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Workspace — Không gian làm việc</title>
<style>
/* =========================================================================
   Workspace Module — UI mockup tĩnh
   Design tokens lấy nguyên từ repo:
   - packages/features/module-shell/src/lib/module-shell.module.scss
   - packages/features/inventory/src/lib/inventory.module.scss
   - packages/shared/ui/src/lib/{minimal-popup-form,popconfirm}.module.css
   - .agents/skills/ui-design/SKILL.md
   ========================================================================= */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color: #0f172a; background: #f8f9ff; font-size: 16px; -webkit-font-smoothing: antialiased;
}
button { font: inherit; }
[hidden] { display: none !important; }

/* ---- Shell --------------------------------------------------------------- */
.shell { display: grid; grid-template-columns: 16rem minmax(0, 1fr); min-height: 100vh; }

/* ---- Rail sidebar -------------------------------------------------------- */
.rail {
  position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column;
  width: 16rem; padding: 1.25rem .85rem; border-right: 1px solid rgba(255,255,255,.08);
  background: #091426; color: #cbd5e1; overflow-y: auto; z-index: 20;
}
.brand { display: flex; align-items: center; gap: .75rem; padding: .25rem .5rem 1.25rem; margin-bottom: .5rem; border-bottom: 1px solid rgba(255,255,255,.08); }
.brandLogo { width: 2.15rem; height: 2.15rem; border-radius: .5rem; display: grid; place-items: center; background: #fff; color: #091426; font-weight: 800; font-size: .82rem; border: 1px solid rgba(255,255,255,.2); box-shadow: 0 1px 3px rgba(0,0,0,.2); flex-shrink: 0; }
.brandText { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.brandTitle { margin: 0; color: #fff; font-size: .92rem; font-weight: 700; letter-spacing: -.015em; }
.brandSubtitle { margin: 0; color: #7dd3fc; font-size: .72rem; font-weight: 600; }
.railNav { display: flex; flex-direction: column; gap: .2rem; flex: 1; }
.railGroup { padding: 1.1rem .6rem .35rem; color: #64748b; font-size: .68rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.navItem { display: flex; gap: .7rem; align-items: center; width: 100%; padding: .55rem .75rem; border: 0; border-radius: .5rem; color: #94a3b8; font-size: .88rem; font-weight: 500; text-align: left; background: transparent; cursor: pointer; transition: all 140ms ease-in-out; }
.navItem:hover { color: #fff; background: #1e293b; }
.navItem.active, .navItem.active:hover { color: #fff; background: #1e293b; font-weight: 600; box-shadow: inset 3px 0 0 #38bdf8; }
.navIcon { display: inline-flex; flex: none; color: #94a3b8; }
.navItem.active .navIcon { color: #38bdf8; }
.navLabel { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.navBadge { flex: none; padding: .1rem .45rem; border-radius: 999px; font-size: .7rem; font-weight: 700; font-variant-numeric: tabular-nums; background: #334155; color: #f1f5f9; }
.navItem.active .navBadge { color: #fff; background: #2563eb; }
.railFoot { margin-top: auto; padding-top: 1rem; display: flex; align-items: center; gap: .45rem; border-top: 1px solid rgba(255,255,255,.08); }
.homeLink { display: flex; align-items: center; gap: .5rem; flex: 1; padding: .5rem .65rem; border: 1px solid rgba(255,255,255,.1); border-radius: .5rem; color: #cbd5e1; font-size: .78rem; font-weight: 600; text-decoration: none; background: rgba(255,255,255,.03); transition: all 140ms ease-in-out; }
.homeLink:hover { color: #fff; background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.2); }
.railLogout { display: inline-flex; align-items: center; justify-content: center; width: 2.15rem; height: 2.15rem; padding: 0; border: 1px solid rgba(239,68,68,.25); border-radius: .5rem; color: #fca5a5; background: rgba(239,68,68,.08); cursor: pointer; transition: all 140ms ease-in-out; }
.railLogout:hover { color: #fff; background: rgba(239,68,68,.25); border-color: rgba(239,68,68,.55); }

/* ---- Main + topbar ------------------------------------------------------- */
.main { min-width: 0; display: flex; flex-direction: column; background: #f8f9ff; }
.topBar { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; justify-content: space-between; gap: 1.25rem; min-height: 4rem; padding: .75rem clamp(1rem, 2.5vw, 2rem); border-bottom: 1px solid #e2e8f0; background: rgba(255,255,255,.95); backdrop-filter: blur(8px); }
.headTitles { display: flex; flex-direction: column; gap: .15rem; min-width: 0; }
.headBreadcrumb { display: flex; align-items: center; gap: .4rem; color: #64748b; font-size: .78rem; font-weight: 500; }
.headTitles h1 { margin: 0; font-size: 1.35rem; font-weight: 700; color: #091426; letter-spacing: -.02em; }
.headTitles p { max-width: 60ch; margin: 0; color: #64748b; font-size: .82rem; line-height: 1.45; }
.headRight { display: flex; align-items: center; gap: .85rem; }
.headActions { display: flex; align-items: center; gap: .5rem; }
.headDivider { width: 1px; height: 1.75rem; background: #e2e8f0; }
.headerBtn { display: inline-flex; align-items: center; gap: .35rem; padding: .42rem .75rem; border: 1px solid #cbd5e1; border-radius: .5rem; color: #0f172a; background: #fff; font-size: .8rem; font-weight: 600; cursor: pointer; transition: all 140ms ease; white-space: nowrap; }
.headerBtn:hover { background: #f1f5f9; border-color: #94a3b8; }
.userProfile { display: flex; align-items: center; gap: .65rem; }
.userAvatar { width: 2.25rem; height: 2.25rem; border-radius: 9999px; background: #091426; color: #fff; font-size: .78rem; font-weight: 700; display: grid; place-items: center; border: 1px solid #e2e8f0; }
.userInfo { display: flex; flex-direction: column; }
.userName { font-size: .82rem; font-weight: 700; color: #0f172a; line-height: 1.25; }
.userRole { font-size: .7rem; color: #64748b; line-height: 1.2; }
.roleSwitch { display: flex; align-items: center; gap: .4rem; padding: .3rem .5rem .3rem .6rem; border: 1px dashed #94a3b8; border-radius: .5rem; background: #f8fafc; }
.roleSwitch span { font-size: .68rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: #64748b; }
.roleSwitch select { padding: .25rem .4rem; border: 1px solid #cbd5e1; border-radius: 4px; font-size: .78rem; font-weight: 600; color: #0f172a; background: #fff; }
.body { padding: 1.25rem clamp(1rem, 2.5vw, 2rem) 3rem; flex: 1; }

/* ---- Cards / KPI --------------------------------------------------------- */
.cardGrid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 1rem; }
.card { padding: 1.2rem 1.25rem; border: 1px solid #e2e8f0; border-radius: .85rem; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
.cardMd { grid-column: span 2; } .cardLg { grid-column: span 3; } .cardXl { grid-column: span 4; }
.cardTitle { margin: 0 0 .6rem; color: #64748b; font-size: .78rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
.kpi { display: flex; align-items: flex-end; justify-content: space-between; gap: .5rem; }
.kpiValue { font-size: 2rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; color: #0f172a; }
.kpiValue.danger { color: #b91c1c; } .kpiValue.warn { color: #b45309; } .kpiValue.ok { color: #15803d; } .kpiValue.info { color: #6d28d9; }
.kpiFoot { margin: .55rem 0 0; font-size: .76rem; color: #64748b; }
.kpiIcon { display: grid; width: 2.5rem; height: 2.5rem; place-items: center; border-radius: .7rem; background: #eff6ff; color: #2563eb; }
.kpiIcon.danger { background: #fef2f2; color: #b91c1c; } .kpiIcon.warn { background: #fffbeb; color: #b45309; } .kpiIcon.info { background: #f5f3ff; color: #6d28d9; }
.card.clickableCard { cursor: pointer; transition: all 140ms ease; }
.card.clickableCard:hover { border-color: #8fb0ed; transform: translateY(-2px); }
.card.selectedCard { border-color: #2563eb; box-shadow: 0 0 0 2px rgba(37,99,235,.15); }

/* ---- Split master-detail 16:9 ------------------------------------------- */
.split { display: grid; grid-template-columns: minmax(0, 43fr) minmax(0, 57fr); gap: 1rem; align-items: start; }
.pane { display: flex; flex-direction: column; min-width: 0; max-height: calc(100vh - 9.5rem); border: 1px solid #e2e8f0; border-radius: .85rem; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.04); overflow: hidden; }
.paneScroll { overflow-y: auto; flex: 1; }
.paneHead { display: flex; align-items: center; justify-content: space-between; gap: .75rem; padding: .7rem .85rem; border-bottom: 1px solid #e2e8f0; background: #f8fafc; flex-wrap: wrap; }
.paneTitle { margin: 0; font-size: .92rem; font-weight: 700; color: #0f172a; }

/* ---- Toolbar trong ô góc bảng ------------------------------------------- */
.toolbar { display: flex; align-items: center; gap: .45rem; flex: 1; flex-wrap: wrap; }
.search { flex: 1; min-width: 7rem; display: flex; align-items: center; gap: .35rem; padding: .3rem .55rem; border: 1px solid #cbd5e1; border-radius: 6px; background: #fff; }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; font-size: .8rem; color: #0f172a; background: transparent; }
select.filter { padding: .3rem .5rem; border: 1px solid #cbd5e1; border-radius: 6px; font-size: .78rem; color: #334155; background: #fff; max-width: 10rem; }

/* ---- Buttons ------------------------------------------------------------- */
.btn { display: inline-flex; align-items: center; gap: .35rem; padding: .34rem .7rem; border-radius: 4px; border: 1px solid transparent; font-size: .8rem; font-weight: 700; cursor: pointer; transition: all 140ms ease; white-space: nowrap; }
.btn-primary { background: #2563eb; color: #fff !important; box-shadow: 0 1px 3px rgba(37,99,235,.2); }
.btn-primary:hover { background: #1d4ed8; }
.btn-primary:disabled { background: #93c5fd; cursor: not-allowed; }
.btn-ghost { background: transparent; border-color: #d1d5db; color: #4b5563; }
.btn-ghost:hover { background: #f1f5f9; }
.btn-danger { background: transparent; border-color: #fca5a5; color: #b91c1c; }
.btn-danger:hover { background: #fef2f2; }
.btn-xs { padding: .22rem .5rem; font-size: .74rem; }
.btn[disabled], .btn.isDisabled { opacity: .45; cursor: not-allowed; pointer-events: none; }
.iconBtn { display: inline-grid; place-items: center; width: 1.9rem; height: 1.9rem; border: 1px solid #e2e8f0; border-radius: .45rem; background: #fff; color: #64748b; cursor: pointer; transition: all 140ms ease; }
.iconBtn:hover { background: #f1f5f9; color: #0f172a; }

/* ---- Bảng 3 vùng --------------------------------------------------------- */
.tableWrap { overflow-x: auto; }
table.data { width: 100%; border-collapse: collapse; font-size: .88rem; }
table.data th { padding: .6rem .85rem; border-bottom: 1px solid #e2e8f0; background: #f8fafc; color: #475569; font-size: .72rem; font-weight: 700; letter-spacing: .06em; text-align: left; text-transform: uppercase; white-space: nowrap; }
table.data td { padding: .65rem .85rem; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
table.data tbody tr { cursor: pointer; }
table.data tbody tr:hover td { background: #f8fafc; }
table.data tbody tr.rowActive td { background: #eff6ff; box-shadow: inset 3px 0 0 #2563eb; }
table.data tbody tr:last-child td { border-bottom: 0; }
.code { font-weight: 700; color: #2563eb; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .82rem; }
.sub { display: block; margin-top: .15rem; color: #64748b; font-size: .76rem; font-weight: 400; }
.numeric { font-variant-numeric: tabular-nums; }
.right { text-align: right; }
.actionCell { display: flex; gap: .35rem; align-items: center; }
.pagerRow { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 10px 14px; border-top: 1px solid #e2e8f0; background: #f8fafc; font-size: 12px; color: #64748b; flex-wrap: wrap; }
.pagerLeft { display: flex; align-items: center; gap: .5rem; }
.pagerRight { display: flex; align-items: center; gap: .5rem; }
.pagerBtn { padding: 4px 10px; border: 1px solid #cbd5e1; border-radius: 6px; background: #fff; color: #334155; font-size: 12px; cursor: pointer; }
.pagerBtn:hover { border-color: #2563eb; }
.pagerNow { font-weight: 700; color: #0f172a; }
.pageSize { padding: 2px 8px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 11.5px; }

/* ---- Badges -------------------------------------------------------------- */
.badge { display: inline-flex; align-items: center; gap: .25rem; padding: .12rem .5rem; border-radius: 999px; font-size: .72rem; font-weight: 700; border: 1px solid transparent; white-space: nowrap; }
.b-todo { background: #f1f5f9; color: #475569; border-color: #e2e8f0; }
.b-progress { background: #eff6ff; color: #1d4ed8; border-color: #dbeafe; }
.b-blocked { background: #fef2f2; color: #b91c1c; border-color: #fecaca; }
.b-review { background: #f5f3ff; color: #6d28d9; border-color: #ddd6fe; }
.b-done { background: #ecfdf5; color: #15803d; border-color: #bbf7d0; }
.b-cancel { background: #f1f5f9; color: #94a3b8; border-color: #e2e8f0; }
.b-amber { background: #fffbeb; color: #b45309; border-color: #fde68a; }
.b-urgent { background: #fef2f2; color: #b91c1c; border-color: #fecaca; }
.b-high { background: #fff7ed; color: #c2410c; border-color: #fed7aa; }
.b-normal { background: #f8fafc; color: #64748b; border-color: #e2e8f0; }
.b-low { background: #f8fafc; color: #94a3b8; border-color: #e2e8f0; }
.overdueTxt { color: #b91c1c; font-weight: 700; }

/* ---- Progress ------------------------------------------------------------ */
.bar { position: relative; height: 6px; border-radius: 999px; background: #e9eef8; overflow: hidden; min-width: 4rem; }
.bar > i { position: absolute; inset: 0 auto 0 0; display: block; border-radius: 999px; background: #2563eb; }
.bar > i.ok { background: #15803d; } .bar > i.warn { background: #d97706; } .bar > i.danger { background: #b91c1c; }
.barRow { display: flex; align-items: center; gap: .5rem; }
.barRow b { font-size: .78rem; font-variant-numeric: tabular-nums; min-width: 2.4rem; text-align: right; }

/* ---- Empty / section ------------------------------------------------------ */
.empty { padding: 2.5rem; border: 1px dashed #cbd5e1; border-radius: .85rem; color: #64748b; font-size: .88rem; text-align: center; background: #fff; }
.sectionTitle { display: flex; align-items: center; justify-content: space-between; gap: .75rem; margin: 1.4rem 0 .7rem; }
.sectionTitle h2 { margin: 0; font-size: 1.05rem; font-weight: 700; color: #0f172a; }
.muted { color: #64748b; font-size: .8rem; }

/* ---- My Work list -------------------------------------------------------- */
.groupLabel { display: flex; align-items: center; gap: .5rem; padding: .75rem .85rem .4rem; color: #64748b; font-size: .72rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.groupLabel .count { padding: .05rem .4rem; border-radius: 999px; background: #e2e8f0; color: #475569; font-size: .7rem; }
.groupLabel.danger { color: #b91c1c; } .groupLabel.danger .count { background: #fee2e2; color: #b91c1c; }
.taskRow { display: flex; gap: .7rem; align-items: flex-start; padding: .65rem .85rem; border-bottom: 1px solid #f1f5f9; cursor: pointer; }
.taskRow:hover { background: #f8fafc; }
.taskRow.rowActive { background: #eff6ff; box-shadow: inset 3px 0 0 #2563eb; }
.taskMain { flex: 1; min-width: 0; }
.taskTitle { font-size: .88rem; font-weight: 600; color: #0f172a; }
.taskMeta { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; margin-top: .3rem; font-size: .75rem; color: #64748b; }
.avatar { width: 1.6rem; height: 1.6rem; border-radius: 999px; display: grid; place-items: center; background: #e2e8f0; color: #334155; font-size: .68rem; font-weight: 700; flex: none; }

/* ---- Detail panel -------------------------------------------------------- */
.detailHead { padding: 1rem 1.1rem; border-bottom: 1px solid #e2e8f0; }
.detailHead h3 { margin: .25rem 0 .4rem; font-size: 1.1rem; font-weight: 700; color: #0f172a; }
.detailBody { padding: 1rem 1.1rem; display: flex; flex-direction: column; gap: 1.1rem; }
.fieldGrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr)); gap: .9rem; }
.fieldGrid span { display: block; color: #64748b; font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
.fieldGrid strong { display: block; margin-top: .2rem; font-size: .88rem; color: #0f172a; font-weight: 600; }
.blockTitle { margin: 0 0 .5rem; font-size: .78rem; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: .04em; }
.miniList { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .35rem; }
.miniList li { display: flex; gap: .55rem; align-items: center; padding: .45rem .6rem; border: 1px solid #e5ebf4; border-radius: .5rem; background: #fff; font-size: .82rem; }
.extCard { display: flex; gap: .6rem; align-items: center; padding: .55rem .65rem; border: 1px solid #e5ebf4; border-radius: .5rem; background: #fff; }
.extCard.degraded { background: #f8fafc; border-style: dashed; color: #94a3b8; }
.extBadge { display: grid; place-items: center; width: 1.9rem; height: 1.9rem; border-radius: .45rem; font-size: .65rem; font-weight: 800; flex: none; }
.ext-mt { background: #fff7ed; color: #c2410c; } .ext-pe { background: #f5f3ff; color: #6d28d9; }
.ext-iv { background: #ecfeff; color: #0e7490; } .ext-crm { background: #fdf2f8; color: #be185d; }

/* ---- Kanban -------------------------------------------------------------- */
.kanban { display: grid; grid-template-columns: repeat(6, minmax(11rem, 1fr)); gap: .7rem; overflow-x: auto; padding-bottom: .5rem; }
.kanCol { display: flex; flex-direction: column; min-width: 0; border: 1px solid #e2e8f0; border-radius: .7rem; background: #f8fafc; }
.kanHead { display: flex; align-items: center; justify-content: space-between; gap: .4rem; padding: .55rem .65rem; border-bottom: 1px solid #e2e8f0; font-size: .75rem; font-weight: 700; color: #475569; text-transform: uppercase; letter-spacing: .04em; }
.kanBody { display: flex; flex-direction: column; gap: .45rem; padding: .55rem; min-height: 5rem; }
.kanCard { padding: .55rem .6rem; border: 1px solid #e2e8f0; border-radius: .5rem; background: #fff; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,.03); }
.kanCard:hover { border-color: #8fb0ed; }
.kanCard .t { font-size: .82rem; font-weight: 600; color: #0f172a; }
.kanCard .m { display: flex; gap: .35rem; align-items: center; margin-top: .4rem; flex-wrap: wrap; }

/* ---- Tree (WBS + thư mục) ------------------------------------------------ */
.tree { list-style: none; margin: 0; padding: .35rem; }
.tree ul { list-style: none; margin: 0; padding-left: .95rem; border-left: 1px dashed #e2e8f0; }
.node { display: flex; gap: .45rem; align-items: center; padding: .35rem .5rem; border-radius: .4rem; cursor: pointer; font-size: .84rem; }
.node:hover { background: #f1f5f9; }
.node.active { background: #eff6ff; box-shadow: inset 3px 0 0 #2563eb; font-weight: 600; }
.twisty { width: 1rem; display: grid; place-items: center; color: #94a3b8; flex: none; }
.node .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---- Calendar ------------------------------------------------------------ */
.calGrid { display: grid; grid-template-columns: 3.5rem repeat(7, minmax(0,1fr)); border-top: 1px solid #e2e8f0; }
.calHeadCell { padding: .5rem .4rem; border-right: 1px solid #f1f5f9; border-bottom: 1px solid #e2e8f0; background: #f8fafc; text-align: center; font-size: .75rem; font-weight: 700; color: #475569; }
.calHeadCell.today { background: #eff6ff; color: #1d4ed8; }
.calHeadCell small { display: block; font-weight: 500; color: #94a3b8; font-size: .68rem; }
.calCol { position: relative; border-right: 1px solid #f1f5f9; min-height: 480px; }
.calTime { border-right: 1px solid #e2e8f0; }
.calSlot { height: 40px; border-bottom: 1px solid #f1f5f9; }
.calHour { height: 40px; border-bottom: 1px solid #f1f5f9; font-size: .68rem; color: #94a3b8; text-align: right; padding: .1rem .4rem 0 0; }
.calEvent { position: absolute; left: 3px; right: 3px; padding: .25rem .4rem; border-radius: .35rem; font-size: .72rem; line-height: 1.25; cursor: pointer; overflow: hidden; border-left: 3px solid; }
.calEvent b { display: block; font-weight: 700; }
.ev-meeting { background: #eff6ff; border-color: #2563eb; color: #1e3a8a; }
.ev-deadline { background: #fef2f2; border-color: #b91c1c; color: #7f1d1d; }
.ev-task { background: #ecfdf5; border-color: #15803d; color: #14532d; }
.ev-other { background: #f5f3ff; border-color: #6d28d9; color: #4c1d95; }
.ev-busy { background: repeating-linear-gradient(45deg, #f1f5f9, #f1f5f9 6px, #e2e8f0 6px, #e2e8f0 12px); border-color: #94a3b8; color: #64748b; }

/* ---- Charts -------------------------------------------------------------- */
.bars { display: flex; flex-direction: column; gap: .5rem; margin: 0; padding: 0; list-style: none; }
.bars li { display: flex; align-items: center; gap: .6rem; font-size: .8rem; }
.bars .who { width: 9rem; flex: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #334155; font-weight: 500; }
.bars .track { flex: 1; display: flex; height: 16px; border-radius: 4px; overflow: hidden; background: #f1f5f9; }

function closePop() { const p = document.querySelector('.popconfirm'); if (p) p.remove(); }
function popconfirm(ev, opt) {
  ev.stopPropagation(); closePop();
  const r = ev.currentTarget.getBoundingClientRect();
  const el = document.createElement('div');
  el.className = 'popconfirm';
  el.innerHTML = '<div class="pcHead"><span style="color:#d97706">'+ic('alert',16)+'</span><div><div class="pcTitle">'+esc(opt.title)+'</div>'
    + '<p class="pcDesc">'+esc(opt.desc)+'</p></div></div>'
    + (opt.confirmInput ? '<label>Nhập chính xác <b>'+esc(opt.confirmInput)+'</b> để xác nhận:</label><input id="pcInput" autocomplete="off" />' : '')
    + '<div class="pcActions"><button class="btn btn-ghost btn-xs" onclick="closePop()">Huỷ</button>'
    + '<button class="btn btn-danger btn-xs" id="pcOk"'+(opt.confirmInput?' disabled':'')+'>'+esc(opt.ok || 'Xác nhận')+'</button></div>';
  document.body.appendChild(el);
  const top = Math.min(r.bottom + 8, window.innerHeight - el.offsetHeight - 12);
  el.style.top = top + 'px';
  el.style.left = Math.max(12, Math.min(r.left - 100, window.innerWidth - 280)) + 'px';
  if (opt.confirmInput) {
    const inp = el.querySelector('#pcInput'), ok = el.querySelector('#pcOk');
    inp.focus();
    inp.oninput = () => { ok.disabled = inp.value.trim() !== opt.confirmInput; };
  }
  el.querySelector('#pcOk').onclick = () => { closePop(); opt.onOk(); };
  setTimeout(() => document.addEventListener('click', function h(e) { if (!el.contains(e.target)) { closePop(); document.removeEventListener('click', h); } }), 0);
}
function popDelete(ev, what, desc) {
  popconfirm(ev, { title:'Xoá '+what+'?', desc: desc, ok:'Xoá', onOk: () => toast('ok','Đã xoá','Thao tác trên bản mockup không thay đổi dữ liệu.') });
}

function finishTask(id) {
  const w = WORK_ITEMS.find(x => x.id === id);
  const blockers = DEPENDENCIES.filter(d => d.suc === id && d.type === 'FS').map(d => WORK_ITEMS.find(x => x.id === d.pre)).filter(p => p.status !== 'done');
  if (blockers.length) { toast('err','Không thể hoàn thành','Công việc tiền nhiệm ' + blockers[0].code + ' chưa hoàn thành.'); return; }
  const kids = children(id).filter(k => !['done','cancelled'].includes(k.status));
  if (kids.length) { toast('err','Không thể hoàn thành','Còn ' + kids.length + ' công việc con chưa hoàn thành.'); return; }
  w.status = 'done'; w.prog = 100;
  render();
  toast('ok','Đã hoàn thành công việc','Ghi actual_end và phát sự kiện workspace.work-item.completed.');
}

  let cols = days.map((d, di) => {
    const evs = EVENTS.filter(e => e.d === di);
    return '<div class="calCol">' + Array.from({length:H1-H0}, () => '<div class="calSlot"></div>').join('')
      + evs.map(e => {

            + '<b>'+esc(e.title)+'</b>' + (e.type!=='busy' ? '<span>'+fmtH(e.h)+(e.room?' · '+e.room:'')+'</span>' : '') + '</div>';
        }).join('') + '</div>';

  const pending = EVENTS.filter(e => e.resp === 'needs_action');

    +     (pending.length ? '<ul class="miniList">' + pending.map(e => '<li><span style="flex:1">'+esc(e.title)+'<span class="sub">'+days[e.d][0]+' · '+fmtH(e.h)+'</span></span></li>'
        + '<li style="border:0;padding-top:0"><button class="btn btn-primary btn-xs" onclick="toast(\'ok\',\'Đã nhận lời\',\'\')">Nhận lời</button>'
        + '<button class="btn btn-ghost btn-xs" onclick="toast(\'ok\',\'Đã từ chối\',\'\')">Từ chối</button>'
        + '<button class="btn btn-ghost btn-xs" onclick="toast(\'ok\',\'Tạm nhận\',\'\')">Tạm nhận</button></li>').join('') + '</ul>'
        : '<p class="muted">Không có lời mời nào.</p>') + '</div>'
    +   '<div><p class="blockTitle">Tài nguyên</p><ul class="miniList">'
    +     ['P.301 · 12 chỗ','P.205 · 6 chỗ','Hội trường A · 60 chỗ','Máy chiếu di động'].map(x => '<li>'+ic('folder',14)+'<span style="flex:1">'+x+'</span></li>').join('')
    +   '</ul>'
    +   (can('resource.manage')
          ? '<button class="btn btn-ghost btn-xs" style="margin-top:.5rem" onclick="toast(\'ok\',\'Quản lý danh mục\',\'Chỉ quản trị tenant mới có quyền workspace.manage.\')">'+ic('edit',12)+' Quản lý danh mục</button>'

    + '<div class="pane"><div class="paneHead"><h2 class="paneTitle">Tuần 14/09 – 20/09/2026</h2>'
    +   '<div class="actionCell"><button class="btn btn-ghost btn-xs">Tháng</button><button class="btn btn-primary btn-xs">Tuần</button><button class="btn btn-ghost btn-xs">Ngày</button></div></div>'
    + '<div class="paneScroll"><div class="calGrid">'+head+'</div><div class="calGrid">'+timeCol+cols+'</div>'
    + '<div style="padding:.75rem .85rem"><ul class="legend">'
    +   [['#2563eb','Cuộc họp'],['#b91c1c','Hạn chót'],['#15803d','Công việc'],['#6d28d9','Khác'],['#94a3b8','Bận (không xem được nội dung)']]
        .map(l => '<li><span class="legendDot" style="background:'+l[0]+'"></span>'+l[1]+'</li>').join('')

function viewDashboard() {
  const scoped = can('report.allPeople');
  const kpis = [
    ['Dự án đang chạy', PROJECTS.filter(p=>['planning','active','on_hold'].includes(p.status)).length, '', 'folder'],
    ['Công việc quá hạn', openItems().filter(isOverdue).length, 'danger', 'alert'],
    ['Sắp đến hạn 7 ngày', 3, 'warn', 'clock'],
    ['Việc hoàn thành trong kỳ', WORK_ITEMS.filter(w=>w.status==='done').length, 'ok', 'check'],
  ];
  const workload = scoped
    ? [['u1',2,1,1,0],['u2',0,1,0,0],['u3',0,0,1,1],['u4',0,0,1,0],['u5',0,0,0,0]]
    : [['u1',2,1,1,0]];
  const maxW = Math.max(...workload.map(r => r[1]+r[2]+r[3]+r[4]), 1);
  const donePct = Math.round(WORK_ITEMS.filter(w=>w.status==='done').length / WORK_ITEMS.length * 100);

  return '<div class="cardGrid">' + kpis.map(k =>
      '<div class="card"><p class="cardTitle">'+k[0]+'</p><div class="kpi"><div class="kpiValue '+k[2]+'">'+k[1]+'</div>'
      + '<div class="kpiIcon '+k[2]+'">'+ic(k[3],18)+'</div></div></div>').join('') + '</div>'
    + (!scoped ? '<div class="notice info" style="margin-top:1rem">'+ic('alert',16)+'<div>Vai trò <b>'+ROLE_LABEL[ROLE]+'</b> chỉ xem được <b>số liệu của chính mình</b> trong báo cáo tải công việc. Bộ chọn nhân sự cũng chỉ liệt kê bạn.</div></div>' : '')
    + '<div class="cardGrid" style="margin-top:1rem">'
    +   '<div class="card cardMd"><p class="cardTitle">Tỷ lệ hoàn thành</p><div class="donutWrap">'
    +     donut(donePct)
    +     '<ul class="legend" style="flex-direction:column;gap:.4rem;margin:0">'
    +       [['#15803d','Hoàn thành',WORK_ITEMS.filter(w=>w.status==='done').length],['#2563eb','Đang làm',WORK_ITEMS.filter(w=>w.status==='in_progress').length],
             ['#b91c1c','Bị chặn',WORK_ITEMS.filter(w=>w.status==='blocked').length],['#94a3b8','Chờ làm',WORK_ITEMS.filter(w=>w.status==='todo').length]]
            .map(l => '<li><span class="legendDot" style="background:'+l[0]+'"></span><span style="flex:1">'+l[1]+'</span><b>'+l[2]+'</b></li>').join('')
    +     '</ul></div></div>'
    +   '<div class="card cardMd"><p class="cardTitle">Tải công việc theo nhân sự</p>'
    +     '<ul class="bars">' + workload.map(r => {
            const tot = r[1]+r[2]+r[3]+r[4], w = (n) => (n / maxW * 100) + '%';
            return '<li><span class="who">'+esc(u(r[0]).name)+'</span><span class="track">'
              + '<i class="seg s-urgent" style="width:'+w(r[1])+'"></i><i class="seg s-high" style="width:'+w(r[2])+'"></i>'
              + '<i class="seg s-normal" style="width:'+w(r[3])+'"></i><i class="seg s-low" style="width:'+w(r[4])+'"></i>'
              + '</span><span class="tot">'+tot+'</span></li>'; }).join('') + '</ul>'
    +     '<ul class="legend">'+[['#b91c1c','Khẩn'],['#ea580c','Cao'],['#2563eb','Thường'],['#94a3b8','Thấp']].map(l=>'<li><span class="legendDot" style="background:'+l[0]+'"></span>'+l[1]+'</li>').join('')+'</ul>'
    +   '</div>'
    + '</div>'
    + '<div class="sectionTitle"><h2>Tiến độ dự án</h2><span class="muted">Cập nhật lúc 09:42 · 16/09/2026</span></div>'
    + '<div class="card" style="padding:0;overflow:hidden"><div class="tableWrap"><table class="data"><thead><tr>'
    +   '<th>Mã · Tên dự án</th><th>Chủ nhiệm</th><th>Tiến độ</th><th class="right">Đóng/Tổng</th><th class="right">Quá hạn</th><th>Hạn</th><th>Trạng thái</th></tr></thead><tbody>'
    +   PROJECTS.map(p => '<tr onclick="sel.project=\''+p.id+'\';go(\'projects\')"'+(p.overdue?' style="background:#fff7f7"':'')+'>'
    +     '<td><span class="code">'+p.code+'</span><span class="sub">'+esc(p.name)+'</span></td>'
    +     '<td>'+av(p.owner)+'</td><td style="min-width:8rem">'+bar(p.progress)+'</td>'
    +     '<td class="right numeric">'+p.done+'/'+p.total+'</td>'
    +     '<td class="right numeric">'+(p.overdue?'<span class="overdueTxt">'+p.overdue+'</span>':'0')+'</td>'
    +     '<td>'+fmtD(p.end)+'</td><td><span class="badge '+PST[p.status].c+'">'+PST[p.status].l+'</span></td></tr>').join('')
    + '</tbody></table></div>'+pager(1,PROJECTS.length,PROJECTS.length,'dự án',1,1)+'</div>'
    + '<div class="sectionTitle"><h2>Công việc quá hạn</h2></div>'
    + (openItems().filter(isOverdue).length
        ? '<div class="card" style="padding:0;overflow:hidden"><div class="tableWrap"><table class="data"><thead><tr>'
          + '<th>Mã việc</th><th>Tiêu đề</th><th>Người phụ trách</th><th>Hạn</th><th class="right">Số ngày trễ</th><th>Ưu tiên</th></tr></thead><tbody>'
          + openItems().filter(isOverdue).sort((a,b)=>a.end.localeCompare(b.end)).map(w => '<tr onclick="sel.task=\''+w.id+'\';go(\'tasks\')">'
          + '<td><span class="code">'+w.code+'</span></td><td>'+esc(w.title)+'</td><td>'+(w.assignee?av(w.assignee)+' '+esc(u(w.assignee).name):'—')+'</td>'
          + '<td class="overdueTxt">'+fmtD(w.end)+'</td><td class="right numeric overdueTxt">'+daysLate(w.end)+'</td><td>'+pbadge(w.prio)+'</td></tr>').join('')
          + '</tbody></table></div></div>'
        : '<div class="empty">Không có công việc quá hạn. 🎉</div>');
}
function donut(pct) {
  const r = 38, c = 2 * Math.PI * r, on = c * pct / 100;
  return '<svg width="110" height="110" viewBox="0 0 110 110">'
    + '<circle cx="55" cy="55" r="'+r+'" fill="none" stroke="#e9eef8" stroke-width="13"/>'
    + '<circle cx="55" cy="55" r="'+r+'" fill="none" stroke="#15803d" stroke-width="13" stroke-linecap="round"'
    + ' stroke-dasharray="'+on+' '+(c-on)+'" transform="rotate(-90 55 55)"/>'
    + '<text x="55" y="51" class="donutTotal">'+pct+'%</text><text x="55" y="68" class="donutUnit">hoàn thành</text></svg>';
}

/* =========================================================================
   DIALOG — MinimalPopupForm
   ========================================================================= */
function f(label, input, hint, full) {
  return '<div class="field'+(full?' full':'')+'"><label>'+label+'</label>'+input+(hint?'<span class="fieldHint">'+hint+'</span>':'')+'</div>';
}
function dlgProject(id) {
  const p = id ? PROJECTS.find(x => x.id === id) : null;
  openDialog(p ? 'Cập nhật dự án' : 'Tạo dự án mới',
    p ? 'Mã dự án không sửa được sau khi tạo.' : 'Người tạo tự động trở thành chủ nhiệm dự án.',
      f('Mã dự án <span style="color:#b91c1c">*</span>', '<input id="pjCode" value="'+(p?p.code:'')+'" '+(p?'disabled':'')+' placeholder="DA-2026-XXX" />', 'Tự chuẩn hoá về chữ hoa, duy nhất trong tenant')
    + f('Tên dự án <span style="color:#b91c1c">*</span>', '<input id="pjName" value="'+(p?esc(p.name):'')+'" placeholder="Nhập tên dự án" />')
    + f('Đơn vị phụ trách', '<select><option>Khối Công nghệ thông tin</option><option>Khối Vận hành</option><option>Ban Chất lượng</option></select>', 'Lấy từ cây tổ chức của Platform Core')
    + f('Trạng thái', '<select><option>Lập kế hoạch</option><option selected>Đang chạy</option><option>Tạm dừng</option></select>')
    + f('Ngày bắt đầu', '<input type="date" id="pjStart" value="'+(p?p.start:'2026-09-16')+'" />')
    + f('Ngày kết thúc', '<input type="date" id="pjEnd" value="'+(p?p.end:'2026-12-31')+'" />')
    + f('Mô tả', '<textarea placeholder="Mục tiêu và phạm vi dự án"></textarea>', null, true),
    p ? 'Lưu thay đổi' : 'Tạo dự án', () => {
      const code = ($('#pjCode').value || '').trim().toUpperCase(), name = ($('#pjName').value || '').trim();
      if (!code) return toast('err','Thiếu thông tin bắt buộc','Mã dự án không được để trống.');
      if (!name) return toast('err','Thiếu thông tin bắt buộc','Tên dự án không được để trống.');
      if (!p && PROJECTS.some(x => x.code === code)) return toast('err','Mã dự án đã tồn tại','Hãy chọn một mã khác.');
      if ($('#pjEnd').value < $('#pjStart').value) return toast('err','Ngày không hợp lệ','Ngày kết thúc phải sau ngày bắt đầu.');
      closeOverlay();
      toast('ok', p ? 'Đã cập nhật dự án' : 'Đã tạo dự án', p ? '' : 'Bạn được gán vai trò owner và ghi outbox workspace.project.created.');
    });
}
function dlgTask(id) {
  const w = id ? WORK_ITEMS.find(x => x.id === id) : null;
  openDialog(w ? 'Cập nhật công việc' : 'Tạo công việc mới',
    w ? 'Mã công việc sinh tự động theo mã dự án.' : 'Công việc sẽ nằm dưới hạng mục đang chọn trên cây WBS.',
      f('Tiêu đề <span style="color:#b91c1c">*</span>', '<input id="tkTitle" value="'+(w?esc(w.title):'')+'" placeholder="Nhập tiêu đề công việc" />', null, true)
    + f('Loại', '<select id="tkType"><option value="task">Công việc</option><option value="phase">Hạng mục</option><option value="milestone">Cột mốc</option></select>')
    + f('Ưu tiên', '<select><option>Thường</option><option>Cao</option><option>Khẩn</option><option>Thấp</option></select>')
    + f('Người phụ trách', '<select '+(can('task.assign')?'':'disabled')+'>'+Object.keys(USERS).map(k=>'<option>'+esc(USERS[k].name)+'</option>').join('')+'</select>', can('task.assign')?'Bắt buộc là thành viên dự án':'Chỉ quản lý dự án mới gán được người')
    + f('Ước lượng (giờ)', '<input id="tkEst" type="number" step="0.25" min="0" value="'+(w&&w.est?w.est:'')+'" placeholder="8" />', 'Số liệu lập kế hoạch, không phải chấm công')
    + f('Ngày bắt đầu', '<input type="date" id="tkStart" value="2026-09-16" />')
    + f('Hạn hoàn thành', '<input type="date" id="tkEnd" value="'+(w?w.end:'2026-09-30')+'" />')
    + f('Mô tả', '<textarea placeholder="Nội dung cần thực hiện"></textarea>', null, true),
    w ? 'Lưu thay đổi' : 'Tạo công việc', () => {
      const t = ($('#tkTitle').value || '').trim();
      if (!t) return toast('err','Thiếu thông tin bắt buộc','Tiêu đề công việc không được để trống.');
      if (t.length > 200) return toast('err','Tiêu đề quá dài','Tiêu đề tối đa 200 ký tự.');
      if ($('#tkEnd').value < $('#tkStart').value) return toast('err','Ngày không hợp lệ','Hạn hoàn thành phải sau ngày bắt đầu.');
      const est = parseFloat($('#tkEst').value || '0');
      if ($('#tkEst').value && est <= 0) return toast('err','Giá trị không hợp lệ','Ước lượng giờ phải lớn hơn 0.');
      if ($('#tkType').value === 'milestone' && $('#tkEst').value) return toast('err','Cột mốc không có giờ ước lượng','Hãy để trống ô Ước lượng.');
      closeOverlay();
      toast('ok', w ? 'Đã cập nhật công việc' : 'Đã tạo công việc', 'Sinh mã theo dự án, đặt status = todo.');
    });
}
function dlgUpload(newVersion) {
  openDialog(newVersion ? 'Tải phiên bản mới' : 'Tải tài liệu lên',
    'Tệp được tải thẳng lên kho lưu trữ bằng URL ký trước. Máy chủ không nhận nội dung tệp.',
      '<div class="field full"><div class="dropzone">'+ic('down',22)+'<b>Kéo thả tệp vào đây</b><span>hoặc bấm để chọn · tối đa 50 MB</span>'
      + '<span class="fieldHint">PDF, Word, Excel, PowerPoint, ảnh, ZIP</span></div></div>'
    + (newVersion ? '' : f('Tên hiển thị <span style="color:#b91c1c">*</span>', '<input id="upName" placeholder="Nhập tên tài liệu" />', null, true))
    + f(newVersion ? 'Ghi chú thay đổi <span style="color:#b91c1c">*</span>' : 'Ghi chú', '<textarea id="upNote" placeholder="'+(newVersion?'Bắt buộc từ phiên bản 2 trở đi':'Tuỳ chọn')+'"></textarea>', null, true)
    + f('Thẻ', '<input placeholder="thiết kế, csdl" />', 'Tối đa 10 thẻ')
    + f('Thư mục', '<select><option>02. Tài liệu thiết kế / Cơ sở dữ liệu</option><option>02. Tài liệu thiết kế / Giao diện</option></select>'),
    newVersion ? 'Tải lên phiên bản mới' : 'Tải lên', () => {
      if (!newVersion && !($('#upName').value || '').trim()) return toast('err','Thiếu thông tin bắt buộc','Tên tài liệu không được để trống.');
      if (newVersion && !($('#upNote').value || '').trim()) return toast('err','Thiếu ghi chú thay đổi','Ghi chú bắt buộc từ phiên bản 2 trở đi.');
      closeOverlay();
      toast('ok','Đã tải lên tài liệu','Ghi metadata rồi trình duyệt PUT thẳng lên MinIO.');
    });
}
function dlgEvent(id) {
  const e = id ? EVENTS.find(x => x.id === id) : null;
  openDialog(e ? 'Cập nhật sự kiện' : 'Tạo sự kiện',
    'Trùng lịch người chỉ cảnh báo; trùng lịch tài nguyên bị chặn.',
      f('Tiêu đề <span style="color:#b91c1c">*</span>', '<input id="evTitle" value="'+(e?esc(e.title):'')+'" placeholder="Nhập tiêu đề sự kiện" />', null, true)
    + f('Loại', '<select><option>Cuộc họp</option><option>Hạn chót</option><option>Công việc</option><option>Khác</option></select>')
    + f('Dự án liên quan', '<select><option>DA-2026-001 · Triển khai ERP Savina</option><option>Không gắn dự án</option></select>')
    + f('Bắt đầu', '<input type="datetime-local" id="evStart" value="2026-09-16T09:00" />')
    + f('Kết thúc', '<input type="datetime-local" id="evEnd" value="2026-09-16T10:30" />')
    + f('Người tham dự', '<select multiple size="3" style="height:auto">'+Object.keys(USERS).map(k=>'<option>'+esc(USERS[k].name)+'</option>').join('')+'</select>', 'Tối đa 100 người')
    + f('Tài nguyên', '<select id="evRoom"><option value="">Không đặt phòng</option><option value="P.301">P.301 · 12 chỗ</option><option value="P.205">P.205 · 6 chỗ</option></select>', 'Phòng đã bận sẽ bị chặn')
    + f('Lặp lại', '<select id="evRep"><option value="">Không lặp</option><option value="d">Hằng ngày</option><option value="w">Hằng tuần</option><option value="m">Hằng tháng</option></select>')
    + f('Kết thúc lặp', '<input type="date" id="evUntil" value="2026-12-31" />', 'Bắt buộc khi bật lặp, tối đa 365 lần'),
    e ? 'Lưu thay đổi' : 'Tạo sự kiện', () => {
      const t = ($('#evTitle').value || '').trim();
      if (!t) return toast('err','Thiếu thông tin bắt buộc','Tiêu đề sự kiện không được để trống.');
      if ($('#evEnd').value <= $('#evStart').value) return toast('err','Thời gian không hợp lệ','Thời gian kết thúc phải sau thời gian bắt đầu.');
      if ($('#evRoom').value === 'P.301') return toast('err','Phòng đã được đặt','P.301 đã có lịch từ 09:00 đến 10:30. Hãy chọn khung giờ hoặc phòng khác.');
      if ($('#evRep').value && !$('#evUntil').value) return toast('err','Thiếu điểm dừng','Phải chọn ngày kết thúc hoặc số lần lặp.');
      closeOverlay();
      toast('ok', e ? 'Đã cập nhật sự kiện' : 'Đã tạo sự kiện', '2 người tham dự đã có lịch khác trong khung giờ này.');
    });
}

/* =========================================================================
   FORMAT
   ========================================================================= */
function fmtD(s) { if (!s) return '—'; const p = s.split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }
function fmtH(h) { const H = Math.floor(h), M = Math.round((h - H) * 60); return String(H).padStart(2,'0')+':'+String(M).padStart(2,'0'); }
function daysLate(end) { return Math.max(1, Math.round((new Date('2026-09-16') - new Date(end)) / 86400000)); }

/* ---- Khởi động ---------------------------------------------------------- */
const h0 = location.hash.replace('#','');
if (TITLES[h0]) view = h0;
render();
/* Khi nhúng vào slide (?slide), bỏ toast chào mừng để không che nội dung. */
if (!location.search.includes('slide')) {
  setTimeout(() => toast('ok','Bản mockup giao diện Workspace','Đổi ô Vai trò trên thanh trên cùng để xem phân quyền thay đổi.'), 600);
}
